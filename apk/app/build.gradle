plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cc.pomodoro'
    compileSdk 34

    defaultConfig {
        applicationId "org.cc.pomodoro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // appcompat includes core transitively — no need to add separately
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
