plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cc.pomodoro'
    compileSdk 34

    defaultConfig {
        applicationId "org.cc.pomodoro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
