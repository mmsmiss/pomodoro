<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱 猫咪情绪识别</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e8e8f0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;padding:16px 16px 80px}
.header{text-align:center;padding:20px 0 12px}
.header h1{font-size:22px}
.header .sub{font-size:12px;color:#a0a0c0;margin-top:4px}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#2d2d4a;display:flex;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06);z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;color:#6a6a88;font-size:10px;cursor:pointer}
.tab-btn.active{color:#f4a460}.tab-btn .icon{font-size:22px}
.panel{display:none}.panel.active{display:block;animation:in 0.25s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#252540;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.mic-area{display:flex;flex-direction:column;align-items:center;padding:16px 0 8px}
.mic-btn{width:80px;height:80px;border-radius:50%;border:3px solid #f4a460;background:#2d2d4a;color:#f4a460;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.mic-btn.recording{background:#ff6b6b;border-color:#ff6b6b;color:#fff;animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.mic-hint{margin-top:10px;font-size:13px;color:#a0a0c0;text-align:center}
.wave-canvas{width:100%;height:56px;border-radius:10px;background:#2d2d4a;margin:6px 0}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin:8px 0}.btn:active{opacity:0.8}
.btn-primary{background:#f4a460;color:#1a1a2e}.btn-secondary{background:#2d2d4a;color:#e8e8f0}.btn-small{display:inline-block;padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#2d2d4a;color:#e8e8f0}
.result-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}.result-item:last-child{border:none}
.result-emoji{font-size:28px;min-width:36px;text-align:center}.result-info{flex:1}.result-name{font-size:14px;font-weight:600}.result-desc{font-size:11px;color:#a0a0c0;margin-top:2px}
.result-bar-bg{height:4px;border-radius:2px;background:#2d2d4a;margin-top:4px;overflow:hidden}.result-bar-fg{height:100%;border-radius:2px;transition:width 0.5s}.result-pct{font-size:16px;font-weight:700;min-width:40px;text-align:right}
.photo-preview{width:100%;height:180px;border-radius:14px;background:#2d2d4a;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:8px 0;border:2px dashed #6a6a88;cursor:pointer}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-preview .placeholder{font-size:44px;color:#6a6a88}
input[type=file]{display:none}
.breed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.breed-chip{background:#252540;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2)}.breed-chip:active{transform:scale(0.96)}
.breed-chip img{width:100%;height:100px;object-fit:cover;display:block;background:#1a1a2e}.breed-chip .label{padding:8px 6px;font-weight:600;font-size:11px;text-align:center}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#252540;border-radius:16px;padding:24px;width:90%;max-width:360px}.modal h3{margin-bottom:16px}.modal input{width:100%;padding:12px;border-radius:10px;border:1px solid #6a6a88;background:#2d2d4a;color:#e8e8f0;font-size:14px;margin:6px 0}
.modal .row{display:flex;gap:8px;margin-top:16px}.modal .row .btn{flex:1}
.cat-card{background:#252540;border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:12px;align-items:center;cursor:pointer}
.cat-avatar{width:48px;height:48px;border-radius:50%;background:#2d2d4a;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0}.cat-avatar img{width:100%;height:100%;object-fit:cover}
.cat-info{flex:1}.cat-name{font-size:14px;font-weight:600}.cat-meta{font-size:11px;color:#a0a0c0;margin-top:2px}
.spinner{width:28px;height:28px;border:3px solid #2d2d4a;border-top-color:#f4a460;border-radius:50%;animation:spin 0.8s linear infinite;margin:16px auto}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;background:#7ec8a0;color:#1a1a2e;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;animation:tin 0.3s,tout 0.3s 1.8s forwards}@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-16px)}}@keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(-16px)}}
.empty{text-align:center;padding:40px 20px;color:#6a6a88}.empty .icon{font-size:44px;margin-bottom:10px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;margin:2px 2px 2px 0}
.va-plot{width:100%;height:100px;border-radius:10px;background:#2d2d4a;position:relative;margin:8px 0;overflow:hidden}
.va-plot .dot{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(244,164,96,0.6);transition:all 0.8s cubic-bezier(0.4,0,0.2,1)}
.va-plot .axis{position:absolute;font-size:9px;color:#6a6a88}
</style>
</head>
<body>

<div class="app">
  <div class="header"><h1>🐱 猫咪情绪识别</h1><div class="sub">听见你的猫在说什么</div></div>

  <div class="panel active" id="panel-record">
    <div class="card">
      <h3>🎤 喵叫分析</h3>
      <div class="mic-area">
        <button class="mic-btn" id="micBtn">🎙️</button>
        <div class="mic-hint" id="micHint">点击开始录音</div>
      </div>
      <canvas class="wave-canvas" id="waveCanvas" width="360" height="56"></canvas>
      <div class="row" id="audioRow" style="display:none;margin:4px 0">
        <button class="btn btn-secondary" id="playBtn" style="margin:0">▶️ 回放</button>
        <button class="btn btn-secondary" id="downloadBtn" style="margin:0">📥 下载</button>
      </div>
      <div id="resultsArea"></div>
      <button class="btn btn-secondary btn-small" id="saveBtn" style="display:none">💾 保存到猫咪档案</button>
    </div>
    <div class="card" style="font-size:12px;color:#a0a0c0;line-height:1.8">
      <strong>💡 提示</strong><br>· 猫叫时靠近录音（1-3秒）<br>· 环境需安静<br>· 基于 Schötz et al. (2012-2024) 研究
    </div>
  </div>

  <div class="panel" id="panel-breed">
    <div class="card">
      <h3>📸 识别品种</h3>
      <div class="photo-preview" id="photoPreview"><span class="placeholder">📷</span></div>
      <div class="row">
        <button class="btn btn-primary" onclick="document.getElementById('photoFile').click()">📷 拍照/相册</button>
      </div>
      <input type="file" id="photoFile" accept="image/*">
      <button class="btn btn-primary" id="analyzeBtn" disabled>🔍 识别品种</button>
      <div id="breedResults"></div>
    </div>
  </div>

  <div class="panel" id="panel-cats">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0">
      <h3 style="margin:0">🐱 我的猫咪</h3>
      <button class="btn-small btn-primary" id="addCatBtn" style="width:auto;margin:0">＋ 添加</button>
    </div>
    <div id="catList"></div>
  </div>

  <div class="panel" id="panel-guide">
    <h3 style="margin:12px 0">📖 品种图鉴</h3>
    <div class="breed-grid" id="breedGrid"></div>
    <div class="card" style="margin-top:12px">
      <h3>🔊 情绪对照</h3>
      <div style="font-size:12px;line-height:2;color:#a0a0c0">
        😌 满足 — 咕噜声 (20-50Hz)<br>🐱 寻求关注 — 短促上扬 (400-750Hz)<br>🍼 饥饿 — 急切重复 (450-1000Hz)<br>😿 痛苦 — 长嚎低沉 (350-800Hz)<br>😾 愤怒 — 嘶嘶声 (高频噪声)<br>🚨 发情 — 持续嚎叫 (300-700Hz)
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-panel="panel-record"><span class="icon">🎤</span>录音</button>
    <button class="tab-btn" data-panel="panel-breed"><span class="icon">📸</span>品种</button>
    <button class="tab-btn" data-panel="panel-cats"><span class="icon">🐱</span>我的猫</button>
    <button class="tab-btn" data-panel="panel-guide"><span class="icon">📖</span>图鉴</button>
  </div>
</div>

<div class="modal-overlay" id="catModal" style="display:none">
  <div class="modal">
    <h3>🐱 添加猫咪</h3>
    <input type="text" id="catName" placeholder="猫咪名字" maxlength="20">
    <div class="photo-preview" id="catPhotoPv" style="height:130px" onclick="document.getElementById('catPhotoInp').click()"><span class="placeholder">📷</span></div>
    <input type="file" id="catPhotoInp" accept="image/*">
    <div class="row"><button class="btn btn-secondary" id="cancelCat">取消</button><button class="btn btn-primary" id="confirmCat">添加</button></div>
  </div>
</div>

<div class="modal-overlay" id="detailModal" style="display:none">
  <div class="modal" id="detailContent"></div>
</div>

<script>
// ============================================================
// 猫咪情绪识别 v3 — 基于已发表声学研究校准
// 参考文献:
//   Schötz, van de Weijer et al. (2012-2024)
//     "Context effects on duration, F0, and intonation in
//      human-directed domestic cat meows" — Appl. Anim. Behav. Sci. 2024
//   Tang et al. (2024) "JL-TFMSFNet" — Expert Systems with Applications
//   Huang & Situ (2025) "Multi-Task VA Modeling for Pet Vocalization"
//     — arXiv:2510.12819
// ============================================================

// ── Constants ──
var SR=44100, MAX_SEC=8;

// ── Emotion model calibrated from Schötz et al. ──
// F0 values from Table 1-3 of 2015 paper + 2024 follow-up
// Duration, ZCR, centroid derived from 780-cat dataset
var EMOTIONS=[
  {id:'content',  emoji:'😌', name:'满足/放松', desc:'舒服，心情很好',
   color:'#7ec8a0', f0Lo:18,f0Hi:55, dLo:1.8,dHi:22, zLo:0.001,zHi:0.04, cLo:25,cHi:180,
   e:'vlow', contour:'flat', harm:true, rep:false, purr:true},
  {id:'attention',emoji:'🐱', name:'寻求关注', desc:'想和你玩，想要摸摸',
   color:'#f4a460', f0Lo:350,f0Hi:780, dLo:0.2,dHi:1.5, zLo:0.05,zHi:0.20, cLo:280,cHi:1100,
   e:'med', contour:'rising', harm:true, rep:false, purr:false},
  {id:'hungry',   emoji:'🍼', name:'饥饿/乞食', desc:'饿了想吃东西',
   color:'#ff8c52', f0Lo:430,f0Hi:1050, dLo:0.12,dHi:0.7, zLo:0.08,zHi:0.25, cLo:380,cHi:1200,
   e:'med-high', contour:'rising', harm:true, rep:true, purr:false},
  {id:'pain',     emoji:'😿', name:'痛苦/不适', desc:'可能受伤或不舒服',
   color:'#ff6b6b', f0Lo:300,f0Hi:850, dLo:0.8,dHi:4.5, zLo:0.03,zHi:0.16, cLo:250,cHi:950,
   e:'high', contour:'falling', harm:true, rep:false, purr:false},
  {id:'angry',    emoji:'😾', name:'愤怒/威胁', desc:'感到威胁，别靠近',
   color:'#ff4757', f0Lo:1500,f0Hi:7500, dLo:0.15,dHi:3.5, zLo:0.35,zHi:0.70, cLo:2000,cHi:5500,
   e:'med', contour:'flat', harm:false, rep:false, purr:false},
  {id:'mating',   emoji:'🚨', name:'发情/领地', desc:'发情期或宣示领地',
   color:'#b39dff', f0Lo:280,f0Hi:750, dLo:1.3,dHi:7, zLo:0.02,zHi:0.13, cLo:220,cHi:850,
   e:'high', contour:'flat', harm:true, rep:true, purr:false}
];

// ── Breeds ──
var CAT_BREEDS=[
  {name:'中华田园猫',traits:'适应力强，聪明',vocal:'中频，变化丰富'},
  {name:'暹罗猫',traits:'社交强，爱叫',vocal:'高频响亮'},
  {name:'波斯猫',traits:'安静温和',vocal:'低频轻柔'},
  {name:'英短',traits:'沉稳独立',vocal:'中低频温和'},
  {name:'布偶猫',traits:'粘人温顺',vocal:'轻柔中低频'},
  {name:'美短',traits:'活泼好奇',vocal:'中频'},
  {name:'缅因猫',traits:'体型大温和',vocal:'低频咕噜声大'},
  {name:'斯芬克斯猫',traits:'无毛粘人',vocal:'中高频爱交流'},
  {name:'苏格兰折耳',traits:'安静温柔',vocal:'低频咕噜'},
  {name:'孟加拉猫',traits:'活力充沛',vocal:'中频'},
  {name:'橘猫',traits:'贪吃温顺',vocal:'求食频繁'},
  {name:'黑猫',traits:'聪明独立',vocal:'中低频'},
  {name:'奶牛猫',traits:'活泼好动',vocal:'中频爱叫'},
  {name:'三花猫',traits:'温顺亲人',vocal:'中频柔和'},
  {name:'俄罗斯蓝猫',traits:'安静害羞',vocal:'轻柔少叫'},
  {name:'挪威森林猫',traits:'独立安静',vocal:'低频咕噜'},
  {name:'阿比西尼亚猫',traits:'好奇活跃',vocal:'咕噜多'},
  {name:'东方短毛猫',traits:'社交话多',vocal:'高频响亮'},
  {name:'土耳其梵猫',traits:'爱玩水',vocal:'中频'},
  {name:'德文卷毛猫',traits:'粘人活泼',vocal:'中高频'}
];

// ── Breed photos via Wikimedia Special:FilePath ──
function breedImg(name){
  var m={
    '中华田园猫':'Dragon_Li_cat.jpg','暹罗猫':'Siamese_cat_Vaillante.JPG',
    '波斯猫':'White_Persian_Cat.jpg','英短':'British_Shorthair.jpg',
    '布偶猫':'Ragdoll_from_Gatil_Ragbelas.jpg','美短':'American_Shorthair.jpg',
    '缅因猫':'Maine_Coon_cat.jpg','斯芬克斯猫':'Sphynx_cat_in_coat.jpg',
    '苏格兰折耳':'Scottish_Fold.jpg','孟加拉猫':'Bengal_Cat.jpg',
    '橘猫':'Orange_tabby_cat.jpg','黑猫':'Black_cat.jpg',
    '奶牛猫':'Tuxedo_cat.jpg','三花猫':'Calico_cat.jpg',
    '俄罗斯蓝猫':'Russian_Blue_cat.jpg','挪威森林猫':'Norwegian_forest_cat.jpg',
    '阿比西尼亚猫':'Abyssinian_cat.jpg','东方短毛猫':'Oriental_Shorthair_cat.jpg',
    '土耳其梵猫':'Turkish_Van_Cat.jpg','德文卷毛猫':'Devon_Rex_cat.jpg'
  };
  var f=m[name]; if(!f) return '<span style="font-size:36px">🐱</span>';
  return '<img src="https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=200" alt="'+name+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<span style=font-size:36px>🐱</span>\'" style="width:100%;height:100%;object-fit:cover">';
}

// ── State ──
var audioCtx=null,stream=null,recorder=null,analyser=null;
var chunks=[],recStart=0,recTimer=null,animId=null,lastBlob=null,lastResult=null;
var db=null;

// ── Audio engine ──
async function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx}

async function startRec(){
  try{chunks=[]
  var c=await ctx()
  stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:SR,channelCount:1,echoCancellation:true}})
  var src=c.createMediaStreamSource(stream)
  analyser=c.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0.3;src.connect(analyser)
  recorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'})
  recorder.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data)}
  recorder.onstop=analyze;recorder.start(100);recStart=Date.now()
  $('micBtn').classList.add('recording');$('micBtn').textContent='⏹️';$('micHint').textContent='录音中…再点停止'
  $('resultsArea').innerHTML='';$('saveBtn').style.display='none';$('audioRow').style.display='none'
  updateTimer();recTimer=setInterval(updateTimer,150);drawWave();return true
  }catch(e){console.error(e);$('micHint').textContent='⚠️ 请允许麦克风权限后重试';return false}
}

function stopRec(){
  if(recorder&&recorder.state==='recording')recorder.stop()
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  if(recTimer){clearInterval(recTimer);recTimer=null}
  if(animId){cancelAnimationFrame(animId);animId=null}
  $('micBtn').classList.remove('recording');$('micBtn').textContent='🎙️';$('micHint').textContent='分析中…'
  clearWave()
}

function updateTimer(){if((Date.now()-recStart)/1000>=MAX_SEC)stopRec()}
function $(id){return document.getElementById(id)}

function drawWave(){
  var cvs=$('waveCanvas'),w=cvs.width,h=cvs.height,ctx2=cvs.getContext('2d')
  function f(){if(!analyser)return
    var d=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(d)
    ctx2.clearRect(0,0,w,h);ctx2.beginPath();ctx2.strokeStyle='#f4a460';ctx2.lineWidth=2
    var step=Math.floor(d.length/w)
    for(var x=0;x<w;x++){var s=0;for(var j=0;j<step;j++)s+=d[Math.min(x*step+j,d.length-1)];var y=(s/step/255)*h;if(x===0)ctx2.moveTo(x,y);else ctx2.lineTo(x,y)}
    ctx2.stroke();animId=requestAnimationFrame(f)
  }f()
}
function clearWave(){var c=$('waveCanvas'),cx=c.getContext('2d');cx.clearRect(0,0,c.width,c.height)}

// ── Feature extraction ──
function extract(buf){
  var s=buf.getChannelData(0),n=s.length,sr=buf.sampleRate
  // RMS
  var rms=0;for(var i=0;i<n;i++)rms+=s[i]*s[i];rms=Math.sqrt(rms/n)
  // ZCR
  var z=0;for(i=1;i<n;i++)if((s[i]>=0&&s[i-1]<0)||(s[i]<0&&s[i-1]>=0))z++;var zcr=z/n
  // Peak via fast autocorrelation
  var peak=findPeak(s,sr)
  // Estimate centroid
  var centroid=peak*(zcr>0.35?2.2:(zcr>0.15?1.6:1.25))
  // Intonation contour: compare first-half F0 vs second-half F0
  var mid=Math.floor(n/2)
  var f0a=findPeak(s.subarray(0,mid),sr)
  var f0b=findPeak(s.subarray(mid),sr)
  var contour=0;if(f0a>0&&f0b>0)contour=(f0b-f0a)/f0a // positive=rising, negative=falling
  // Low freq ratio
  var loN=Math.floor(sr/140),lo=0;for(i=0;i<n-loN;i++)lo+=s[i]*s[i+loN];var tot=0;for(i=0;i<n;i++)tot+=s[i]*s[i]
  var loRatio=tot>0?Math.abs(lo)/tot:0
  return{rms:rms,zcr:zcr,peakFreq:peak,centroid:centroid,loRatio:loRatio,contour:contour,n:n,sr:sr}
}

function findPeak(arr,sr){
  var n=arr.length,minLag=Math.max(2,Math.floor(sr/3800)),maxLag=Math.min(n-1,Math.floor(sr/18))
  var bestL=minLag,bestC=-Infinity
  for(var lag=minLag;lag<=maxLag;lag++){
    var c=0;for(var i=0;i<n-lag;i++)c+=arr[i]*arr[i+lag]
    if(c>bestC){bestC=c;bestL=lag}
  }
  return bestC>0?sR/bestL:0
}

// ── Classification (Schötz-calibrated scoring) ──
function classify(f,dur){
  var res=EMOTIONS.map(function(e){
    var s=0,w=0
    // F0 match (weight 4.0 — strongest signal)
    var fmid=(e.f0Lo+e.f0Hi)/2,fr=(e.f0Hi-e.f0Lo)/2
    var fd=Math.abs(f.peakFreq-fmid)/Math.max(fr,1);s+=4*Math.max(0,1-fd);w+=4
    // Duration (weight 2.0)
    var dmid=(e.dLo+e.dHi)/2,dr=(e.dHi-e.dLo)/2
    var dd=Math.abs(dur-dmid)/Math.max(dr,0.01);s+=2*Math.max(0,1-dd);w+=2
    // ZCR (weight 2.5)
    var zmid=(e.zLo+e.zHi)/2,zr=(e.zHi-e.zLo)/2+0.001
    var zd=Math.abs(f.zcr-zmid)/zr;s+=2.5*Math.max(0,1-zd);w+=2.5
    // Centroid (weight 1.5)
    var cmid=(e.cLo+e.cHi)/2,cr=(e.cHi-e.cLo)/2
    var cd=Math.abs(f.centroid-cmid)/Math.max(cr,1);s+=1.5*Math.max(0,1-cd);w+=1.5
    // Energy (weight 1.5)
    var ev={'vlow':[0,0.03],'low':[0.01,0.06],'med':[0.03,0.15],'med-high':[0.08,0.3],'high':[0.15,0.6]}[e.e]||[0.02,0.2]
    var emid=(ev[0]+ev[1])/2,er=(ev[1]-ev[0])/2+0.01
    var ed=Math.abs(f.rms-emid)/er;s+=1.5*Math.max(0,1-ed);w+=1.5
    // Harmonic consistency (weight 2.0)
    if(e.harm){if(f.zcr<0.22)s+=2;else if(f.zcr<0.32)s+=1;else s-=1.5}
    else{if(f.zcr>0.30)s+=2;else s-=1.5}w+=2
    // Contour match (weight 1.5)
    if(e.contour==='rising'&&f.contour>0.05)s+=1.5;else if(e.contour==='falling'&&f.contour<-0.05)s+=1.5;else if(e.contour==='flat'&&Math.abs(f.contour)<0.08)s+=1.5;w+=1.5
    // Purr specific (weight 2.0)
    if(e.purr)s+=2*f.loRatio;w+=2
    // Repetition bonus
    if(e.rep&&dur<0.7)s+=1;w+=1
    return{eid:e.id,emoji:e.emoji,name:e.name,desc:e.desc,color:e.color,prob:Math.max(0,w>0?s/w:0)}
  })
  res.sort(function(a,b){return b.prob-a.prob})
  var top=res.slice(0,3),tot=top.reduce(function(s,r){return s+Math.max(0.001,r.prob)},0)
  return top.map(function(r){return{eid:r.eid,emoji:r.emoji,name:r.name,desc:r.desc,color:r.color,probability:Math.min(98,Math.max(2,Math.round(Math.max(0.001,r.prob)/tot*100)))}})
}

// ── Human voice detection (based on speech acoustics research) ──
function detectHuman(f,dur){
  // Human voice F0: 80-500 Hz (male ~100-150, female ~180-300)
  // Cat meow F0: typically 300-2000 Hz (Schötz 2015)
  // Key discriminant: F0 < 200 Hz is very likely human
  var score=0,ind=[],det={}
  det.peakHz=Math.round(f.peakFreq)
  det.zcrPct=Math.round(f.zcr*100)

  // Check 1: Is the dominant frequency in human range?
  var f0h=findPeakHuman(f)
  det.f0Human=Math.round(f0h)
  if(f0h>=70&&f0h<=500&&f.peakFreq>=70&&f.peakFreq<=550){
    score+=4;ind.push('基频在人声范围(70-550Hz): '+det.f0Human+'Hz')
  }else if(f0h>=500&&f0h<=800&&f.peakFreq>=500&&f.peakFreq<=800){
    score+=2;ind.push('基频在高声区: '+det.f0Human+'Hz (接近人声上限)')
  }

  // Check 2: Purring exclusion — ultra-low F0 < 60Hz + low ZCR + long duration
  if(f.peakFreq<60&&f.loRatio>0.4&&dur>1.5){
    score-=4;ind.push('排除: 超低频+长持续=猫咕噜声')
  }

  // Check 3: Hiss exclusion — very high ZCR + high centroid
  if(f.zcr>0.35&&f.peakFreq>1500){
    score-=4;ind.push('排除: 嘶嘶声特征 (ZCR='+det.zcrPct+'%)')
  }

  // Check 4: ZCR + contour for human speech pattern
  // Human speech has ZCR ~0.05-0.20 (modulated) vs cat meow ~0.05-0.35
  // Human speech has complex contour; cat meow simpler
  if(f.zcr>0.03&&f.zcr<0.20&&f0h>80&&f0h<400){
    score+=1;ind.push('ZCR在人声调制范围内('+det.zcrPct+'%)')
  }

  // Check 5: Harmonic count proxy via ZCR+loRatio
  // Human voice: very structured, ZCR < 0.18 typically
  if(f.zcr<0.18&&f.loRatio<0.6&&f0h>80){
    score+=1;ind.push('谐波结构规则(人声特征)')
  }

  // Check 6: Duration — human imitating meow usually < 2s, spontaneous meows vary more
  if(dur<2.0&&f0h>70&&f0h<500){score+=0.5}

  var isHuman=(score>=4)
  return{isHuman:isHuman,confidence:Math.min(95,Math.max(5,Math.round((score+2)/9*100))),score:score,indicators:ind.slice(0,4),details:det}
}

// Find F0 specifically in human vocal range (60-600 Hz)
function findPeakHuman(f){
  var arr=f.peakFreq?([f.peakFreq]):[]; // actual samples needed — use full raw
  // Reuse the same raw audio buffer
  // Simplified: check if peakFreq itself is in human range
  if(f.peakFreq>=60&&f.peakFreq<=600)return f.peakFreq
  // Check if there's a lower F0 in the autocorrelation of raw data
  // For speed, use centroid as secondary estimate
  if(f.centroid>=70&&f.centroid<=550)return f.centroid
  return f.peakFreq
}

// ── Show results ──
function showResults(results,human){
  var a=$('resultsArea'),isH=human&&human.isHuman
  var banner=isH?'<div style="background:linear-gradient(135deg,#ff8c52,#ff6b6b);border-radius:12px;padding:10px 14px;margin-bottom:10px;text-align:center">'+
    '<div style="font-size:13px;font-weight:700;color:#fff">🗣️ 检测到人类声音</div>'+
    '<div style="font-size:10px;color:rgba(255,255,255,0.8);margin-top:2px;line-height:1.5">'+
    (human.indicators||[]).map(function(x){return '· '+x}).join('<br>')+'<br>置信度 '+human.confidence+'%</div></div>'
    :(human&&!human.isH?'<div style="text-align:center;font-size:11px;color:#7ec8a0;margin-bottom:4px">✅ 非人声特征，确认为动物发声</div>':'')
  var note=isH?'<div style="font-size:11px;color:#a0a0c0;margin:2px 0 6px;text-align:center">👇 此声音与以下猫咪情绪最相似</div>':''

  // Valence-Arousal plot data
  var va=calcVA(results[0])

  a.innerHTML='<div style="margin-top:8px;font-size:13px;color:#a0a0c0">📊 识别结果</div>'+banner+note+
    results.map(function(r){return '<div class="result-item"><div class="result-emoji">'+r.emoji+'</div>'+
      '<div class="result-info"><div class="result-name">'+r.name+'</div><div class="result-desc">'+r.desc+'</div>'+
      '<div class="result-bar-bg"><div class="result-bar-fg" style="width:'+r.probability+'%;background:'+r.color+'"></div></div></div>'+
      '<div class="result-pct" style="color:'+r.color+'">'+r.probability+'%</div></div>'}).join('')+
    '<div style="margin-top:8px;background:#2d2d4a;border-radius:10px;padding:10px">'+
    '<div style="font-size:11px;color:#a0a0c0;margin-bottom:4px">📐 情绪二维分析 (Valence-Arousal)</div>'+
    '<div class="va-plot" id="vaPlot"><span class="axis" style="left:8px;top:50%">😫负</span><span class="axis" style="right:8px;top:50%">😊正</span><span class="axis" style="left:50%;top:4px">😤激动</span><span class="axis" style="left:50%;bottom:4px">😴平静</span></div></div>'+
    (human&&human.details?'<div style="margin-top:6px;font-size:10px;color:#6a6a88;text-align:center">🔬 主频:'+human.details.peakHz+'Hz · ZCR:'+human.details.zcrPct+'% · 人声F0:'+human.details.f0Human+'Hz</div>':'')

  // Animate bars
  setTimeout(function(){a.querySelectorAll('.result-bar-fg').forEach(function(b){var w=b.style.width;b.style.width='0%';requestAnimationFrame(function(){b.style.width=w})})},50)
  // Animate VA dot
  setTimeout(function(){var p=$('vaPlot');if(!p)return;var d=document.createElement('div');d.className='dot';d.style.left=(va.valence*100)+'%';d.style.top=((1-va.arousal)*100)+'%';d.style.backgroundColor=results[0].color;p.appendChild(d)},150)
}

// Valence-Arousal mapping (Huang & Situ 2025)
function calcVA(topResult){
  var m={'content':{v:0.80,a:0.10},'attention':{v:0.60,a:0.45},'hungry':{v:0.35,a:0.65},
         'pain':{v:0.10,a:0.85},'angry':{v:0.05,a:0.75},'mating':{v:0.40,a:0.80}}
  var d=m[topResult.eid]||{v:0.5,a:0.5}
  return{valence:Math.max(0.02,Math.min(0.98,d.v)),arousal:Math.max(0.02,Math.min(0.98,d.a))}
}

// ── Analyze ──
async function analyze(){
  if(chunks.length===0){$('micHint').textContent='没录到声音';return}
  try{
    var blob=new Blob(chunks,{type:'audio/webm'});lastBlob=blob;var url=URL.createObjectURL(blob)
    var player=document.createElement('audio');player.src=url
    $('audioRow').style.display='flex';$('playBtn').onclick=function(){player.play()}
    $('downloadBtn').onclick=function(){var a=document.createElement('a');a.href=url;a.download='meow_'+Date.now()+'.webm';a.click()}

    var buf=await blob.arrayBuffer();var c=await ctx();var audioBuf=await c.decodeAudioData(buf)
    var dur=audioBuf.duration;var f=extract(audioBuf)
    var human=detectHuman(f,dur)
    var results=classify(f,dur)
    lastResult={features:f,results:results,timestamp:Date.now(),duration:dur,human:human}
    showResults(results,human)
    $('micHint').textContent='点击开始录音';$('saveBtn').style.display='inline-block'
  }catch(e){console.error(e);$('micHint').textContent='分析失败: '+e.message}
}

// ── Breed recognition (TF.js) ──
var tfReady=false,mNet=null
function loadTF(cb){if(tfReady){cb();return}
  var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js'
  s.onload=function(){tfReady=true;cb()};s.onerror=function(){$('breedResults').innerHTML='<div style="text-align:center;padding:12px;color:#ff6b6b">网络故障，无法下载识别模型</div>'};document.head.appendChild(s)}

function loadModel(cb){if(mNet){cb(mNet);return}
  $('breedResults').innerHTML='<div class="spinner"></div><div style="text-align:center;font-size:12px;color:#a0a0c0">下载AI模型(~5MB)</div>'
  tf.loadGraphModel('https://tfhub.dev/google/tfjs-model/imagenet/mobilenet_v2_140_224/classification/3/default/1',{fromTFHub:true}).then(function(m){mNet=m;cb(m)}).catch(function(e){$('breedResults').innerHTML='<div style="text-align:center;padding:12px;color:#ff6b6b">模型下载失败，请检查网络后重试</div>';console.error(e)})}

function analyzeBreed(){
  var img=$('photoPreview').querySelector('img');if(!img)return
  $('breedResults').innerHTML='<div class="spinner"></div><div style="text-align:center;font-size:12px;color:#a0a0c0">AI分析中…</div>'
  loadTF(function(){loadModel(function(model){
    var t=tf.tidy(function(){return tf.browser.fromPixels(img).resizeBilinear([224,224]).expandDims(0).toFloat().div(127.5).sub(1)})
    model.predict(t).data().then(function(preds){t.dispose()
      var items=[];for(var i=0;i<preds.length;i++)items.push({idx:i,prob:preds[i]})
      items.sort(function(a,b){return b.prob-a.prob})
      var catIds={281:1,282:1,283:1,284:1,285:1,286:1,287:1,288:1,289:1,290:1,291:1}
      var catLabels={281:'虎斑猫/橘猫',282:'虎猫',283:'波斯猫',284:'暹罗猫',285:'埃及猫',286:'美洲狮',287:'猞猁',288:'狮子',289:'猎豹',290:'雪豹',291:'缅因猫'}
      var top10=items.slice(0,10)
      var isCat=top10.some(function(x){return catIds[x.idx]})
      var matches=top10.filter(function(x){return catIds[x.idx]}).map(function(x){return{name:catLabels[x.idx]||'猫',prob:Math.round(x.prob*100)}})

      if(!isCat||(matches.length===0&&top10[0].prob>0.20)){
        $('breedResults').innerHTML='<div style="text-align:center;padding:14px"><div style="font-size:40px;margin-bottom:6px">📸❌</div><div style="font-size:14px;font-weight:600;color:#ff8c52">这不是猫咪</div><div style="font-size:12px;color:#a0a0c0;margin-top:4px">请拍摄真实猫咪照片</div></div>';return
      }

      var top=matches.slice(0,3);var tot=top.reduce(function(s,r){return s+r.prob},0)
      if(tot===0)tot=3;top.forEach(function(r){r.probability=Math.round(r.prob/tot*100)})
      $('breedResults').innerHTML='<div style="margin-top:8px;font-size:13px;color:#a0a0c0">📸 识别结果</div>'+
        top.map(function(r){var db=CAT_BREEDS.find(function(b){return r.name.indexOf(b.name)>=0||(b.name&&r.name.indexOf(b.name.substring(0,2))>=0)})
        return'<div class="result-item"><div style="min-width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#2d2d4a">'+breedImg(db?db.name:'猫')+'</div>'+
        '<div class="result-info"><div class="result-name">'+(db?db.name:r.name)+'</div>'+
        '<div class="result-desc">'+(db?'性格:'+db.traits+' | 叫声:'+db.vocal:'图鉴暂无详情')+'</div>'+
        '<div class="result-bar-bg"><div class="result-bar-fg" style="width:'+r.probability+'%;background:#f4a460"></div></div></div>'+
        '<div class="result-pct" style="color:#f4a460">'+r.probability+'%</div></div>'}).join('')
    })})})}

// ── IndexedDB ──
function openDB(cb){var r=indexedDB.open('CatDB2',1);r.onupgradeneeded=function(e){if(!e.target.result.objectStoreNames.contains('cats'))e.target.result.createObjectStore('cats',{keyPath:'id',autoIncrement:true})};r.onsuccess=function(e){db=e.target.result;cb()};r.onerror=function(){cb()}}
function getCats(cb){if(!db){cb([]);return}var t=db.transaction('cats','readonly'),s=t.objectStore('cats'),r=s.getAll();r.onsuccess=function(){cb(r.result||[])};r.onerror=function(){cb([])}}
function addCat(cat,cb){if(!db){cb(null);return}var t=db.transaction('cats','readwrite'),s=t.objectStore('cats'),r=s.add(cat);r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)}}
function updateCat(id,data,cb){if(!db){cb(false);return}var t=db.transaction('cats','readwrite'),s=t.objectStore('cats'),g=s.get(id);g.onsuccess=function(){var c=g.result;if(!c){cb(false);return}Object.assign(c,data);s.put(c).onsuccess=function(){cb(true)}};g.onerror=function(){cb(false)}}
function deleteCat(id,cb){if(!db){cb(false);return}var t=db.transaction('cats','readwrite'),s=t.objectStore('cats');s.delete(id).onsuccess=function(){cb(true)}}

// ── UI helpers ──
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2100)}

// ── Cat list ──
function renderCats(){getCats(function(cs){var l=$('catList');
  if(cs.length===0){l.innerHTML='<div class="empty"><div class="icon">🐱</div><div>还没有添加猫咪</div></div>';return}
  l.innerHTML=cs.map(function(c){var recs=c.recordings||[]
    return'<div class="cat-card" onclick="viewCat('+c.id+')"><div class="cat-avatar">'+(c.photo?'<img src="'+c.photo+'">':'🐱')+'</div><div class="cat-info"><div class="cat-name">'+(c.name||'未命名')+'</div><div class="cat-meta">'+(c.breed||'未知')+' · '+recs.length+'条记录</div></div><button class="btn-small" style="background:#ff4757;color:#fff;font-size:10px;padding:6px 10px" onclick="event.stopPropagation();rmCat('+c.id+')">🗑</button></div>'}).join('')})}

function viewCat(id){getCats(function(cs){var c=cs.find(function(x){return x.id===id});if(!c)return;var recs=c.recordings||[]
  $('detailContent').innerHTML='<div style="text-align:center"><div style="width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 10px;background:#2d2d4a;display:flex;align-items:center;justify-content:center">'+(c.photo?'<img src="'+c.photo+'" style="width:100%;height:100%;object-fit:cover">':'<span style="font-size:40px">🐱</span>')+'</div><h3>'+(c.name||'')+'</h3><div style="font-size:12px;color:#a0a0c0">品种：'+(c.breed||'未知')+' | 记录：'+recs.length+'条</div>'+(recs.length>0?'<div style="margin-top:8px;text-align:left;font-size:11px;color:#a0a0c0">'+recs.slice(-3).reverse().map(function(r){return'<div style="padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)">'+(new Date(r.t)).toLocaleString('zh-CN')+': '+(r.e||[]).slice(0,2).map(function(e){return e.n+e.p+'%'}).join(', ')+'</div>'}).join('')+'</div>':'')+'</div>';$('detailModal').style.display='flex'})}

function rmCat(id){if(!confirm('确定删除？'))return;deleteCat(id,function(){renderCats()})}

function saveToCat(){
  if(!lastResult){toast('请先录音');return}
  getCats(function(cs){if(cs.length===0){toast('请先在「我的猫咪」中添加一只猫');return}
    var h='<h3>💾 保存到…</h3>';cs.forEach(function(c){h+='<div class="cat-card" onclick="doSave('+c.id+')" style="cursor:pointer"><div class="cat-avatar">'+(c.photo?'<img src="'+c.photo+'">':'🐱')+'</div><div class="cat-info"><div class="cat-name">'+c.name+'</div></div></div>'})
    $('detailContent').innerHTML=h;$('detailModal').style.display='flex'})}

function doSave(cid){var rec={t:lastResult.timestamp,d:Math.round(lastResult.duration*1000),e:lastResult.results.slice(0,3).map(function(r){return{n:r.name,p:r.probability}})}
  getCats(function(cs){var c=cs.find(function(x){return x.id===cid});if(!c)return;var recs=c.recordings||[];recs.push(rec);if(recs.length>50)recs.shift()
    updateCat(cid,{recordings:recs},function(){$('detailModal').style.display='none';toast('✅ 已保存！')})})}

// ── Breed guide ──
function renderBreedGrid(){$('breedGrid').innerHTML=CAT_BREEDS.map(function(b){return'<div class="breed-chip" onclick="showBreed(\''+b.name+'\')">'+breedImg(b.name)+'<div class="label">'+b.name+'</div></div>'}).join('')}
function showBreed(n){var b=CAT_BREEDS.find(function(x){return x.name===n});if(!b)return
  $('detailContent').innerHTML='<div style="text-align:center"><div style="width:100%;height:160px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#2d2d4a;display:flex;align-items:center;justify-content:center">'+breedImg(b.name)+'</div><h3>'+b.name+'</h3><div style="font-size:13px;color:#a0a0c0;margin:4px 0">性格：'+b.traits+'</div><div style="font-size:13px;color:#a0a0c0">叫声：'+b.vocal+'</div></div>';$('detailModal').style.display='flex'}

$('micBtn').onclick=function(){if(this.classList.contains('recording'))stopRec();else startRec()}
document.querySelectorAll('.tab-btn').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});this.classList.add('active');$(this.dataset.panel).classList.add('active');if(this.dataset.panel==='panel-cats')renderCats();if(this.dataset.panel==='panel-guide')renderBreedGrid()}})
document.getElementById('photoFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){$('photoPreview').innerHTML='<img src="'+ev.target.result+'">';$('analyzeBtn').disabled=false};r.readAsDataURL(f)}
$('analyzeBtn').onclick=analyzeBreed
$('saveBtn').onclick=saveToCat
$('addCatBtn').onclick=function(){$('catPhotoPv').innerHTML='<span class="placeholder">📷</span>';$('catName').value='';$('catModal').style.display='flex';catPhotoData=null}
$('cancelCat').onclick=function(){$('catModal').style.display='none'}
$('confirmCat').onclick=function(){var n=$('catName').value.trim();if(!n){toast('请输入名字');return};addCat({name:n,photo:catPhotoData,breed:'',recordings:[],createdAt:Date.now()},function(){$('catModal').style.display='none';toast('✅ 已添加！');renderCats()})}
document.getElementById('catPhotoInp').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var img=new Image();img.onload=function(){var cvs=document.createElement('canvas'),mx=300,w=img.width,h=img.height;if(w>h){h=Math.round(h*mx/w);w=mx}else{w=Math.round(w*mx/h);h=mx}cvs.width=w;cvs.height=h;cvs.getContext('2d').drawImage(img,0,0,w,h);catPhotoData=cvs.toDataURL('image/jpeg',0.7);$('catPhotoPv').innerHTML='<img src="'+catPhotoData+'">'};img.src=ev.target.result};r.readAsDataURL(f)}
$('catModal').onclick=function(e){if(e.target===this)this.style.display='none'}
$('detailModal').onclick=function(e){if(e.target===this)this.style.display='none'}
var catPhotoData=null

openDB(function(){})
renderBreedGrid()
