<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #313244;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --muted: #6c7086;
    --red: #f38ba8;
    --green: #a6e3a1;
    --blue: #89b4fa;
    --yellow: #f9e2af;
    --purple: #cba6f7;
    --peach: #fab387;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    text-align: center;
    width: 380px;
    padding: 20px;
  }

  h1 { font-size: 26px; margin-bottom: 4px; letter-spacing: 2px; }

  /* ── 进度环 ── */
  .ring-container {
    position: relative;
    width: 280px; height: 280px;
    margin: 10px auto;
  }

  .ring-container svg {
    transform: rotate(-90deg);
    width: 280px; height: 280px;
  }

  .ring-bg {
    fill: none;
    stroke: var(--surface);
    stroke-width: 14;
  }

  .ring-progress {
    fill: none;
    stroke: var(--red);
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.9s linear, stroke 0.4s;
  }

  .ring-progress.break-short { stroke: var(--green); }
  .ring-progress.break-long  { stroke: var(--blue); }

  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-text {
    font-family: "Consolas", "SF Mono", "Fira Code", monospace;
    font-size: 48px;
    font-weight: bold;
    color: var(--text);
    letter-spacing: 3px;
  }

  .timer-status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── 模式标签 ── */
  .mode-label {
    font-size: 13px;
    color: var(--subtext);
    margin-bottom: 8px;
    transition: color 0.3s;
  }

  /* ── 按钮 ── */
  .btn-group {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 8px 0;
  }

  button {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: transform 0.1s, opacity 0.2s, background 0.2s;
  }
  button:active { transform: scale(0.96); }

  .mode-btn {
    font-size: 11px;
    padding: 8px 12px;
    background: var(--surface);
    color: var(--subtext);
  }
  .mode-btn:hover { opacity: 0.85; }
  .mode-btn.active { color: var(--bg); }
  .mode-btn.active.work        { background: var(--red); }
  .mode-btn.active.short-break { background: var(--green); }
  .mode-btn.active.long-break  { background: var(--blue); }

  .ctrl-btn {
    font-size: 15px;
    padding: 10px 24px;
    color: var(--bg);
    min-width: 90px;
  }
  .ctrl-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }

  #btnStart { background: var(--purple); }
  #btnPause { background: var(--peach); }
  #btnReset { background: var(--yellow); }

  /* ── 番茄计数 ── */
  .tomato-row {
    font-size: 18px;
    margin: 12px 0 4px;
    letter-spacing: 4px;
  }
  .tomato-detail {
    font-size: 11px;
    color: var(--subtext);
  }

  /* ── 置顶 ── */
  .options {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 11px;
    color: var(--subtext);
  }
  .options label {
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  .options input[type="checkbox"] {
    accent-color: var(--purple);
  }

  /* ── 通知权限提示 ── */
  .perm-hint {
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
  }
  .perm-hint a { color: var(--blue); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="app">
  <h1>🍅 番茄钟</h1>

  <!-- 进度环 -->
  <div class="ring-container">
    <svg viewBox="0 0 280 280">
      <circle class="ring-bg" cx="140" cy="140" r="126"/>
      <circle class="ring-progress" id="ring" cx="140" cy="140" r="126"
              stroke-dasharray="791.68" stroke-dashoffset="0"/>
    </svg>
    <div class="time-display">
      <div class="timer-text" id="timerText">25:00</div>
      <div class="timer-status" id="timerStatus">准备开始</div>
    </div>
  </div>

  <!-- 模式 -->
  <div class="mode-label" id="modeLabel">工作模式</div>
  <div class="btn-group">
    <button class="mode-btn active work" id="btnWork"  data-mode="work">🍅  工作</button>
    <button class="mode-btn short-break" id="btnShort" data-mode="short_break">☕  短休</button>
    <button class="mode-btn long-break"  id="btnLong"  data-mode="long_break">😴  长休</button>
  </div>

  <!-- 控制 -->
  <div class="btn-group">
    <button class="ctrl-btn" id="btnStart">▶  开始</button>
    <button class="ctrl-btn" id="btnPause" disabled>⏸  暂停</button>
    <button class="ctrl-btn" id="btnReset">↺  重置</button>
  </div>

  <!-- 番茄计数 -->
  <div class="tomato-row" id="tomatoIcons">⚪⚪⚪⚪</div>
  <div class="tomato-detail" id="tomatoDetail">第 1/4 个番茄 | 已完成 0 个</div>

  <!-- 选项 -->
  <div class="options">
    <label><input type="checkbox" id="chkTop"> 📌 窗口置顶</label>
    <label><input type="checkbox" id="chkSound" checked> 🔊 提示音</label>
  </div>
  <div class="perm-hint" id="permHint" style="display:none">
    ⚠️ <a id="reqPerm">点击启用浏览器通知</a>
  </div>
</div>

<script>
// ── 常量 ──────────────────────────────────────────
const WORK_TIME   = 25 * 60;
const SHORT_BREAK =  5 * 60;
const LONG_BREAK  = 15 * 60;
const TOMATOES_PER_CYCLE = 4;
const CIRCUMFERENCE = 2 * Math.PI * 126;  // ≈ 791.68

// ── DOM 引用 ─────────────────────────────────────
const $ring      = document.getElementById("ring");
const $timerText = document.getElementById("timerText");
const $timerStatus = document.getElementById("timerStatus");
const $modeLabel = document.getElementById("modeLabel");
const $btnStart  = document.getElementById("btnStart");
const $btnPause  = document.getElementById("btnPause");
const $btnReset  = document.getElementById("btnReset");
const $btnWork   = document.getElementById("btnWork");
const $btnShort  = document.getElementById("btnShort");
const $btnLong   = document.getElementById("btnLong");
const $tomatoIcons = document.getElementById("tomatoIcons");
const $tomatoDetail = document.getElementById("tomatoDetail");
const $chkTop    = document.getElementById("chkTop");
const $chkSound  = document.getElementById("chkSound");
const $permHint  = document.getElementById("permHint");
const $reqPerm   = document.getElementById("reqPerm");

// ── 状态 ─────────────────────────────────────────
let timeLeft        = WORK_TIME;
let totalTime       = WORK_TIME;
let currentMode     = "work";
let timerState      = "idle";   // idle | running | paused
let tomatoesDone    = 0;
let intervalId      = null;
let soundEnabled    = true;
let notificationOk  = false;

// ── 音频 (Web Audio 生成提示音) ──────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playBeep() {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.35);
  } catch (_) {}
}

function playTripleBeep() {
  if (!soundEnabled) return;
  playBeep();
  setTimeout(playBeep, 200);
  setTimeout(playBeep, 400);
}

// ── 通知 ─────────────────────────────────────────
function sendNotification(title, body) {
  if (Notification.permission === "granted") {
    new Notification(title, { body, icon: "🍅" });
  }
}

function checkNotificationPerm() {
  if (Notification.permission === "granted") {
    notificationOk = true;
    $permHint.style.display = "none";
  } else if (Notification.permission === "default") {
    $permHint.style.display = "block";
  } else {
    $permHint.style.display = "none";
  }
}

$reqPerm.addEventListener("click", async () => {
  const perm = await Notification.requestPermission();
  if (perm === "granted") {
    notificationOk = true;
    $permHint.style.display = "none";
  }
});

// ── 绘制 ─────────────────────────────────────────
function updateDisplay() {
  // 进度环
  const fraction = totalTime > 0 ? timeLeft / totalTime : 0;
  const offset = CIRCUMFERENCE * (1 - fraction);
  $ring.setAttribute("stroke-dashoffset", offset);

  // 环颜色
  $ring.classList.remove("break-short", "break-long");
  if (currentMode === "short_break") $ring.classList.add("break-short");
  if (currentMode === "long_break")  $ring.classList.add("break-long");

  // 时间
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  $timerText.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;

  // 状态文字
  const statusMap = { idle: "准备开始", running: "进行中…", paused: "已暂停" };
  $timerStatus.textContent = statusMap[timerState];
}

function updateTomatoes() {
  const pos = tomatoesDone % TOMATOES_PER_CYCLE;
  const filled = "🍅".repeat(pos);
  const empty  = "⚪".repeat(TOMATOES_PER_CYCLE - pos);
  const cycle  = Math.floor(tomatoesDone / TOMATOES_PER_CYCLE) + 1;
  $tomatoIcons.textContent = filled + empty;
  $tomatoDetail.textContent = `第 ${pos + 1}/${TOMATOES_PER_CYCLE} 个番茄 | 已完成 ${tomatoesDone} 个`;
}

// ── 按钮样式 ─────────────────────────────────────
function updateModeButtons() {
  [$btnWork, $btnShort, $btnLong].forEach(b => b.classList.remove("active"));
  const map = { work: $btnWork, short_break: $btnShort, long_break: $btnLong };
  map[currentMode].classList.add("active");
}

function updateCtrlButtons() {
  if (timerState === "running") {
    $btnStart.disabled = true;
    $btnPause.disabled = false;
    $btnReset.disabled = false;
    $btnStart.textContent = "▶  开始";
  } else if (timerState === "paused") {
    $btnStart.disabled = false;
    $btnPause.disabled = true;
    $btnReset.disabled = false;
    $btnStart.textContent = "▶  继续";
  } else {
    $btnStart.disabled = false;
    $btnPause.disabled = true;
    $btnReset.disabled = false;
    $btnStart.textContent = "▶  开始";
  }
}

// ── 模式切换 ─────────────────────────────────────
function switchMode(mode) {
  stopTimer();
  currentMode = mode;
  timerState  = "idle";
  const times = { work: WORK_TIME, short_break: SHORT_BREAK, long_break: LONG_BREAK };
  timeLeft  = times[mode];
  totalTime = times[mode];
  const labels = { work: "工作模式", short_break: "短休息模式", long_break: "长休息模式" };
  $modeLabel.textContent = labels[mode];
  updateModeButtons();
  updateCtrlButtons();
  updateDisplay();
}

// ── 定时器 ───────────────────────────────────────
function startTimer() {
  if (timerState === "running") return;
  // 首次点击时激活 AudioContext
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  timerState = "running";
  updateCtrlButtons();
  updateDisplay();
  intervalId = setInterval(tick, 1000);
}

function pauseTimer() {
  if (timerState !== "running") return;
  timerState = "paused";
  stopTimer();
  updateCtrlButtons();
  updateDisplay();
}

function resetTimer() {
  stopTimer();
  timerState = "idle";
  const times = { work: WORK_TIME, short_break: SHORT_BREAK, long_break: LONG_BREAK };
  timeLeft  = times[currentMode];
  totalTime = times[currentMode];
  updateCtrlButtons();
  updateDisplay();
}

function stopTimer() {
  if (intervalId !== null) {
    clearInterval(intervalId);
    intervalId = null;
  }
}

function tick() {
  if (timerState !== "running") return;
  if (timeLeft > 0) {
    timeLeft--;
    updateDisplay();
  } else {
    onTimerFinished();
  }
}

function onTimerFinished() {
  stopTimer();
  timerState = "idle";

  // 提示
  playTripleBeep();
  sendNotification(
    "🍅 番茄钟",
    currentMode === "work" ? "工作时间结束，休息一下吧！" : "休息结束，开始新的番茄！"
  );

  // 自动切换
  if (currentMode === "work") {
    tomatoesDone++;
    updateTomatoes();
    const next = (tomatoesDone % TOMATOES_PER_CYCLE === 0) ? "long_break" : "short_break";
    switchMode(next);
  } else {
    switchMode("work");
  }

  updateCtrlButtons();
  updateDisplay();
}

// ── 窗口置顶 (Picture-in-Picture 近似) ───────────
$chkTop.addEventListener("change", () => {
  if ($chkTop.checked) {
    // 尝试使用 Document Picture-in-Picture API
    if (document.pictureInPictureEnabled) {
      // 不能直接使用，但保留扩展可能
    }
    // 大多数浏览器不支持真正的置顶，提醒用户
    alert("💡 提示：按 Win+↑ 最大化窗口，或使用浏览器的「画中画」功能让计时器始终可见。\n\n也可以安装为 PWA 应用（Chrome 地址栏右侧 ⊕ 图标）获得桌面窗口体验。");
    $chkTop.checked = false;
  }
  saveSettings();
});

$chkSound.addEventListener("change", () => {
  soundEnabled = $chkSound.checked;
  saveSettings();
});

// ── 键盘快捷键 ───────────────────────────────────
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (timerState === "running") pauseTimer();
    else startTimer();
  } else if (e.code === "KeyR") {
    resetTimer();
  } else if (e.code === "Digit1") {
    switchMode("work");
  } else if (e.code === "Digit2") {
    switchMode("short_break");
  } else if (e.code === "Digit3") {
    switchMode("long_break");
  }
});

// ── 模式按钮事件 ─────────────────────────────────
$btnWork.addEventListener("click",  () => switchMode("work"));
$btnShort.addEventListener("click", () => switchMode("short_break"));
$btnLong.addEventListener("click",  () => switchMode("long_break"));
$btnStart.addEventListener("click", startTimer);
$btnPause.addEventListener("click", pauseTimer);
$btnReset.addEventListener("click", resetTimer);

// ── 设置持久化 (localStorage) ────────────────────
function saveSettings() {
  try {
    const s = {
      soundEnabled: soundEnabled,
      tomatoesDone: tomatoesDone,
    };
    localStorage.setItem("pomodoro_settings", JSON.stringify(s));
  } catch (_) {}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem("pomodoro_settings");
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.soundEnabled === "boolean") {
      soundEnabled = s.soundEnabled;
      $chkSound.checked = s.soundEnabled;
    }
    if (typeof s.tomatoesDone === "number" && s.tomatoesDone >= 0) {
      tomatoesDone = s.tomatoesDone;
      updateTomatoes();
    }
  } catch (_) {}
}

// ── 页面标题同步 ─────────────────────────────────
const titleBase = "🍅 番茄钟";
function updatePageTitle() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const t = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  document.title = timerState === "running" ? `[${t}] ${titleBase}` : titleBase;
}
const origUpdate = updateDisplay;
updateDisplay = function() {
  origUpdate();
  updatePageTitle();
};

// ── 启动 ─────────────────────────────────────────
function init() {
  loadSettings();
  checkNotificationPerm();
  $ring.style.strokeDasharray = CIRCUMFERENCE;
  $ring.style.strokeDashoffset = "0";
  updateModeButtons();
  updateCtrlButtons();
  updateDisplay();
  updateTomatoes();
}

init();
</script>
</body>
</html>
