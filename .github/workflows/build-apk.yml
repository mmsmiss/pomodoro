name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'apk/**'
      - 'pomodoro.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: /home/runner/android-sdk
          key: android-sdk-v2-${{ runner.os }}

      - name: Download Android command-line tools
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-*.zip

      - name: Install Android SDK packages
        run: |
          # Accept licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          # Install platform + build-tools
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            > /dev/null 2>&1

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apk/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download Gradle 8.4
        run: |
          cd /tmp
          curl -sSLO https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "GRADLE_HOME=/tmp/gradle-8.4" >> $GITHUB_ENV
          echo "/tmp/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build debug APK
        working-directory: apk
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          # Tell Gradle where the SDK is
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Debug: show what we have
          echo "=== SDK contents ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "no platforms"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "no build-tools"
          echo "=== Starting Gradle build ==="
          gradle assembleDebug --info 2>&1 | tail -200

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-apk
          path: apk/app/build/outputs/apk/debug/*.apk
