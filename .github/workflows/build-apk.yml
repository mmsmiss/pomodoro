name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'apk/**'
      - 'pomodoro.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: /home/runner/android-sdk
          key: android-sdk-v3-${{ runner.os }}

      - name: Download Android command-line tools
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-*.zip

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            > /dev/null 2>&1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v2-${{ hashFiles('apk/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-v2-

      - name: Download Gradle 8.5
        run: |
          cd /tmp
          curl -sSLO https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Copy pomodoro.html into assets
        run: |
          mkdir -p apk/app/src/main/assets
          cp pomodoro.html apk/app/src/main/assets/index.html
          echo "=== assets ==="
          ls -la apk/app/src/main/assets/

      - name: Build debug APK
        working-directory: apk
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug 2>&1

      - name: Find APK
        run: |
          echo "=== Searching for APK ==="
          find apk -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-apk
          path: apk/**/*.apk
          if-no-files-found: warn
