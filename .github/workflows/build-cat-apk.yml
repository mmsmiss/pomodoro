name: Build Cat Translator APK

on:
  push:
    branches: [master, main]
    paths:
      - 'cat-translator-apk/**'
      - 'cat-translator-v2.html'
      - 'cat-translator-cute.html'
      - '.github/workflows/build-cat-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: /home/runner/android-sdk
          key: android-sdk-v5-${{ runner.os }}

      - name: Download Android command-line tools
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-*.zip

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            > /dev/null 2>&1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cat-v3-${{ runner.os }}-${{ hashFiles('cat-translator-apk/**/*.gradle*') }}
          restore-keys: |
            gradle-cat-v3-${{ runner.os }}-

      - name: Download Gradle 8.4
        run: |
          cd /tmp
          curl -sSLO https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "/tmp/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Download MobileNet model (offline recognition)
        run: |
          mkdir -p cat-translator-apk/app/src/main/assets/model
          cd cat-translator-apk/app/src/main/assets/model
          BASE="https://storage.googleapis.com/tfhub-tfjs-modules/google/imagenet/mobilenet_v2_140_224/classification/3"
          curl -sSLO "$BASE/model.json"
          curl -sSLO "$BASE/group1-shard1of2.bin"
          curl -sSLO "$BASE/group1-shard2of2.bin"
          echo "=== Model files ==="
          ls -la
          du -sh .

      - name: Copy HTML + TF.js + model into assets
        run: |
          mkdir -p cat-translator-apk/app/src/main/assets
          cp cat-translator-cute.html cat-translator-apk/app/src/main/assets/index.html
          curl -sSLO https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js
          mv tf.min.js cat-translator-apk/app/src/main/assets/tf.min.js
          echo "=== Assets ==="
          ls -la cat-translator-apk/app/src/main/assets/

      - name: Build debug APK
        working-directory: cat-translator-apk
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-translator-apk
          path: cat-translator-apk/**/*.apk
