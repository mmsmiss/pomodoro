<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱 猫咪情绪识别 v2 · 人声检测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#1a1a2e;color:#e8e8f0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;justify-content:center;min-height:100vh;user-select:none;
}
.app{width:100%;max-width:420px;padding:16px 16px 80px}
.header{text-align:center;padding:20px 0 12px}
.header h1{font-size:22px}
.header .sub{font-size:12px;color:#a0a0c0;margin-top:4px}

/* Tabs */
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;
  background:#2d2d4a;display:flex;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06);z-index:100
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  border:none;background:none;color:#6a6a88;font-size:10px;cursor:pointer
}
.tab-btn.active{color:#f4a460}
.tab-btn .icon{font-size:22px}

.panel{display:none}
.panel.active{display:block;animation:in 0.25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:#252540;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Mic */
.mic-area{display:flex;flex-direction:column;align-items:center;padding:24px 0}
.mic-btn{
  width:96px;height:96px;border-radius:50%;border:4px solid #f4a460;
  background:#2d2d4a;color:#f4a460;font-size:40px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(244,164,96,0.2);transition:all 0.25s
}
.mic-btn.recording{
  background:#ff6b6b;border-color:#ff6b6b;color:#fff;
  animation:pulse 1.2s infinite;box-shadow:0 0 40px rgba(255,107,107,0.4)
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mic-hint{margin-top:12px;font-size:13px;color:#a0a0c0}

/* Wave */
.wave-canvas{width:100%;height:70px;border-radius:12px;background:#2d2d4a;margin:8px 0}

/* Buttons */
.btn{
  display:block;width:100%;padding:14px;border:none;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;margin:8px 0;transition:opacity 0.2s
}
.btn:active{opacity:0.8}
.btn-primary{background:#f4a460;color:#1a1a2e}
.btn-secondary{background:#2d2d4a;color:#e8e8f0}
.btn-small{display:inline-block;padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#2d2d4a;color:#e8e8f0}
.btn-play{width:100%;padding:10px;border:none;border-radius:10px;background:#2d2d4a;color:#e8e8f0;font-size:13px;cursor:pointer}

/* Results */
.result-item{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.05)
}
.result-item:last-child{border:none}
.result-emoji{font-size:32px;min-width:40px;text-align:center}
.result-info{flex:1}
.result-name{font-size:14px;font-weight:600}
.result-desc{font-size:11px;color:#a0a0c0;margin-top:2px}
.result-bar-bg{height:5px;border-radius:3px;background:#2d2d4a;margin-top:4px;overflow:hidden}
.result-bar-fg{height:100%;border-radius:3px;transition:width 0.6s}
.result-pct{font-size:17px;font-weight:700;min-width:42px;text-align:right}

/* Photo */
.photo-preview{
  width:100%;height:200px;border-radius:16px;background:#2d2d4a;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  margin:8px 0;border:2px dashed #6a6a88;cursor:pointer
}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-preview .placeholder{font-size:48px;color:#6a6a88}
input[type=file]{display:none}

/* Breed grid */
.breed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.breed-chip{
  background:#252540;border-radius:12px;overflow:hidden;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:transform 0.15s
}
.breed-chip:active{transform:scale(0.96)}
.breed-chip img{width:100%;height:100px;object-fit:cover;display:block}
.breed-chip .label{padding:8px 6px;font-weight:600;font-size:11px;text-align:center}

/* Modal */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);
  z-index:200;display:flex;align-items:center;justify-content:center
}
.modal{
  background:#252540;border-radius:16px;padding:24px;width:90%;max-width:360px
}
.modal h3{margin-bottom:16px}
.modal input{
  width:100%;padding:12px;border-radius:10px;border:1px solid #6a6a88;
  background:#2d2d4a;color:#e8e8f0;font-size:14px;margin:6px 0
}
.modal .row{display:flex;gap:8px;margin-top:16px}
.modal .row .btn{flex:1}

/* Cat list */
.cat-card{
  background:#252540;border-radius:16px;padding:14px;margin:8px 0;
  display:flex;gap:12px;align-items:center;cursor:pointer
}
.cat-avatar{
  width:52px;height:52px;border-radius:50%;background:#2d2d4a;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  overflow:hidden;flex-shrink:0
}
.cat-avatar img{width:100%;height:100%;object-fit:cover}
.cat-info{flex:1}
.cat-name{font-size:14px;font-weight:600}
.cat-meta{font-size:11px;color:#a0a0c0;margin-top:2px}

.spinner{
  width:32px;height:32px;border:3px solid #2d2d4a;
  border-top-color:#f4a460;border-radius:50%;animation:spin 0.8s linear infinite;margin:16px auto
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;
  background:#7ec8a0;color:#1a1a2e;padding:10px 24px;border-radius:20px;
  font-size:13px;font-weight:600;animation:tin 0.3s,tout 0.3s 1.7s forwards
}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-20px)}}
@keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.empty{text-align:center;padding:40px 20px;color:#6a6a88}
.empty .icon{font-size:48px;margin-bottom:12px}
.audio-row{display:flex;gap:8px;margin:8px 0}
.audio-row button{flex:1}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🐱 猫咪情绪识别</h1>
    <div class="sub">听见你的猫在说什么 · 识别人类模仿</div>
  </div>

  <!-- 🎤 录音 -->
  <div class="panel active" id="panel-record">
    <div class="card">
      <h3>🎤 喵叫分析</h3>
      <div class="mic-area">
        <button class="mic-btn" id="micBtn">🎙️</button>
        <div class="mic-hint" id="micHint">点击开始录音</div>
      </div>
      <canvas class="wave-canvas" id="waveCanvas" width="360" height="70"></canvas>
      <div style="display:flex;align-items:center;gap:4px;margin:-2px 0 4px 0;font-size:10px;color:#6a6a88;justify-content:center">
        🔊 声纹实时分析 — 录音时显示声音频率波动
      </div>
      <div class="audio-row" id="audioRow" style="display:none">
        <button class="btn-play" id="playBtn">▶️ 回放</button>
        <button class="btn-play" id="downloadBtn" style="background:#f4a460;color:#1a1a2e">📥 下载</button>
      </div>
      <div id="resultsArea"></div>
      <button class="btn btn-secondary btn-small" id="saveBtn" style="display:none">💾 保存到猫咪档案</button>
    </div>
    <div class="card" style="font-size:12px;color:#a0a0c0;line-height:1.8">
      <strong>💡 使用技巧</strong><br>
      · 猫咪叫的时候靠近录音<br>
      · 远离环境噪音<br>
      · 录 1-3 秒即可<br>
      · 显示 3 种最可能的情绪，概率从高到低
    </div>
  </div>

  <!-- 📸 品种 -->
  <div class="panel" id="panel-breed">
    <div class="card">
      <h3>📸 识别品种</h3>
      <div class="photo-preview" id="photoPreview">
        <span class="placeholder">📷</span>
      </div>
      <div class="audio-row">
        <button class="btn btn-primary" onclick="openCamera()">📷 拍照</button>
        <button class="btn btn-secondary" onclick="var i=document.getElementById('galleryInput');i.click()">🖼️ 相册</button>
      </div>
      <input type="file" id="galleryInput" accept="image/*">
      <button class="btn btn-primary" id="analyzeBtn" disabled>🔍 识别品种</button>
      <div id="breedResults"></div>
    </div>
  </div>

  <!-- Camera modal -->
  <div class="modal-overlay" id="cameraModal" style="display:none">
    <div class="modal" style="max-width:340px;padding:12px">
      <h3 style="text-align:center;margin-bottom:8px">📷 拍照</h3>
      <video id="camVideo" autoplay playsinline muted style="width:100%;height:240px;object-fit:cover;border-radius:12px;background:#000;margin:4px 0;display:none"></video>
      <canvas id="camCanvas" style="display:none"></canvas>
      <div id="camLoading" style="text-align:center;padding:60px 0;color:#a0a0c0;font-size:13px">
        <div class="spinner"></div>
        正在启动相机…
      </div>
      <div id="camError" style="font-size:11px;color:#ff6b6b;text-align:center;margin:6px 0;display:none"></div>
      <div class="row" style="margin-top:8px;align-items:center">
        <button class="btn btn-small" id="camFlipBtn" onclick="flipCamera()" style="flex:none;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;display:none" title="翻转摄像头">🔄</button>
        <button class="btn btn-secondary" onclick="closeCamera()" style="flex:1;margin:0">取消</button>
        <button class="btn btn-primary" onclick="snapPhoto()" style="flex:1;margin:0">📸 拍摄</button>
      </div>
    </div>
  </div>

  <!-- 🐱 我的猫 -->
  <div class="panel" id="panel-cats">

    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0">
      <h3 style="margin:0">🐱 我的猫咪</h3>
      <button class="btn-small btn-primary" id="addCatBtn" style="width:auto;margin:0">＋ 添加</button>
    </div>
    <div id="catList"></div>
  </div>

  <!-- 📖 图鉴 -->
  <div class="panel" id="panel-guide">
    <h3 style="margin:12px 0">📖 品种图鉴</h3>
    <div class="breed-grid" id="breedGrid"></div>
    <div class="card" style="margin-top:12px">
      <h3>🔊 情绪对照</h3>
      <div style="font-size:12px;line-height:2;color:#a0a0c0">
        😾 愤怒/威胁 — 嘶嘶声<br>
        😿 痛苦/不适 — 长嚎<br>
        🐱 寻求关注 — 短促上扬<br>
        😌 满足/放松 — 咕噜声<br>
        🚨 发情 — 持续嚎叫<br>
        🍼 饥饿 — 短促重复<br>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-panel="panel-record"><span class="icon">🎤</span>录音</button>
    <button class="tab-btn" data-panel="panel-breed"><span class="icon">📸</span>品种</button>
    <button class="tab-btn" data-panel="panel-cats"><span class="icon">🐱</span>我的猫</button>
    <button class="tab-btn" data-panel="panel-guide"><span class="icon">📖</span>图鉴</button>
  </div>
</div>

<!-- Add cat modal -->
<div class="modal-overlay" id="addCatModal" style="display:none">
  <div class="modal">
    <h3>🐱 添加猫咪</h3>
    <input type="text" id="catNameInput" placeholder="猫咪名字" maxlength="20">
    <div class="photo-preview" id="catPhotoPreview" style="height:140px" onclick="document.getElementById('catPhotoInput').click()">
      <span class="placeholder">📷</span>
    </div>
    <input type="file" id="catPhotoInput" accept="image/*" capture="environment">
    <div class="row">
      <button class="btn btn-secondary" id="cancelAdd">取消</button>
      <button class="btn btn-primary" id="confirmAdd">添加</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detailModal" style="display:none">
  <div class="modal" id="detailContent"></div>
</div>

<script>
// ============================================================
//  猫咪情绪识别器 v2 — clean rewrite
// ============================================================

// ── 常量 ──
var SAMPLE_RATE = 44100;
var MAX_SEC = 5;

// ── 基于声学研究的猫叫声情绪模型 ──
// 参考文献: Nicastro & Owren (2003), Yeon et al. (2011), Schötz et al. (2012-2019)
// 六个基础类别，每类权重基于已发表研究的声学参数范围
// === Schötz 2024 calibrated emotion model (50 cats, 969 meows) ===
// F0 data: Attention 559Hz(+/-40) n=487, Content 495Hz(+/-40) n=52,
//   Stressed 579Hz(+/-39) n=78, Food 581Hz(+/-38) n=341,
//   Greeting 484Hz(+/-44) n=61, Door 661Hz(+/-30) n=75
// Duration: Content 545ms, Food 728ms, Stressed 912ms, Carrier 932ms
// Intonation: Greeting=steep rise, Carrier=fall, Door=level
// Purr: Schötz 2015 F0=18-31Hz; Hiss: Yeon 2011 aperiodic
var EMOTIONS = [
  {id:'content',emoji:'😌',name:'满足/放松',desc:'咕噜声，舒服放松',
   color:'#7ec8a0',f0Lo:15,f0Hi:60,dLo:1.5,dHi:25,zLo:0.001,zHi:0.05,cLo:20,cHi:200,
   contour:'flat',harm:true,rep:false,e:'very-low',purr:true},
  {id:'attention',emoji:'🐱',name:'寻求关注',desc:'打招呼或想引起注意',
   color:'#f4a460',f0Lo:390,f0Hi:720,dLo:0.3,dHi:1.5,zLo:0.05,zHi:0.22,cLo:300,cHi:1100,
   contour:'rising',harm:true,rep:false,e:'medium',purr:false},
  {id:'hungry',emoji:'🍼',name:'饥饿/乞食',desc:'想吃东西了',
   color:'#ff8c52',f0Lo:490,f0Hi:700,dLo:0.3,dHi:1.2,zLo:0.07,zHi:0.25,cLo:380,cHi:1200,
   contour:'rising',harm:true,rep:true,e:'medium-high',purr:false},
  {id:'pain',emoji:'😿',name:'痛苦/不适',desc:'不舒服或紧张',
   color:'#ff6b6b',f0Lo:440,f0Hi:700,dLo:0.6,dHi:4,zLo:0.03,zHi:0.18,cLo:250,cHi:950,
   contour:'falling',harm:true,rep:false,e:'high',purr:false},
  {id:'angry',emoji:'😾',name:'愤怒/威胁',desc:'嘶嘶声，在警告',
   color:'#ff4757',f0Lo:1200,f0Hi:8000,dLo:0.1,dHi:4,zLo:0.30,zHi:0.70,cLo:1800,cHi:6000,
   contour:'flat',harm:false,rep:false,e:'medium',purr:false},
  {id:'mating',emoji:'🚨',name:'发情/领地',desc:'发情期嚎叫或宣示领地',
   color:'#b39dff',f0Lo:250,f0Hi:750,dLo:1.2,dHi:8,zLo:0.02,zHi:0.15,cLo:200,cHi:900,
   contour:'flat',harm:true,rep:true,e:'high',purr:false}
];;

var CAT_BREEDS = [
  {name:'中华田园猫',traits:'适应力强，聪明',vocal:'中频，变化丰富'},
  {name:'暹罗猫',traits:'社交强，爱叫',vocal:'高频响亮'},
  {name:'波斯猫',traits:'安静温和',vocal:'低频轻柔'},
  {name:'英短',traits:'沉稳独立',vocal:'中低频温和'},
  {name:'布偶猫',traits:'粘人温顺',vocal:'轻柔中低频'},
  {name:'美短',traits:'活泼好奇',vocal:'中频'},
  {name:'缅因猫',traits:'体型大温和',vocal:'低频咕噜声大'},
  {name:'斯芬克斯猫',traits:'无毛粘人',vocal:'中高频爱交流'},
  {name:'苏格兰折耳',traits:'安静温柔',vocal:'低频咕噜'},
  {name:'孟加拉猫',traits:'活力充沛',vocal:'中频'},
  {name:'橘猫',traits:'贪吃温顺',vocal:'求食频繁'},
  {name:'黑猫',traits:'聪明独立',vocal:'中低频'},
  {name:'奶牛猫',traits:'活泼好动',vocal:'中频爱叫'},
  {name:'三花猫',traits:'温顺亲人',vocal:'中频柔和'},
  {name:'俄罗斯蓝猫',traits:'安静害羞',vocal:'轻柔少叫'},
  {name:'挪威森林猫',traits:'独立安静',vocal:'低频咕噜'},
  {name:'阿比西尼亚猫',traits:'好奇活跃',vocal:'咕噜多'},
  {name:'东方短毛猫',traits:'社交话多',vocal:'高频响亮'},
  {name:'土耳其梵猫',traits:'爱玩水',vocal:'中频'},
  {name:'德文卷毛猫',traits:'粘人活泼',vocal:'中高频'}
];

// ── 猫咪品种照片（Wikimedia Commons 真实照片）──
// 使用 Special:FilePath 重定向 API，始终获取有效缩略图
// 每张 ~15-30KB，懒加载，失败时显示 emoji
function breedImg(name){
  var fileMap={
    '中华田园猫':'Dragon_Li_cat.jpg',
    '暹罗猫':'Siamese_cat_Vaillante.JPG',
    '波斯猫':'White_Persian_Cat.jpg',
    '英短':'British_Shorthair.jpg',
    '布偶猫':'Ragdoll_from_Gatil_Ragbelas.jpg',
    '美短':'American_Shorthair.jpg',
    '缅因猫':'Maine_Coon_cat.jpg',
    '斯芬克斯猫':'Sphynx_cat_in_coat.jpg',
    '苏格兰折耳':'Scottish_Fold.jpg',
    '孟加拉猫':'Bengal_Cat.jpg',
    '橘猫':'Orange_tabby_cat.jpg',
    '黑猫':'Black_cat.jpg',
    '奶牛猫':'Tuxedo_cat.jpg',
    '三花猫':'Calico_cat.jpg',
    '俄罗斯蓝猫':'Russian_Blue_cat.jpg',
    '挪威森林猫':'Norwegian_forest_cat.jpg',
    '阿比西尼亚猫':'Abyssinian_cat.jpg',
    '东方短毛猫':'Oriental_Shorthair_cat.jpg',
    '土耳其梵猫':'Turkish_Van_Cat.jpg',
    '德文卷毛猫':'Devon_Rex_cat.jpg'
  };
  var f=fileMap[name];
  if(!f)return'<span style="font-size:40px">🐱</span>';
  // Wikimedia Special:FilePath redirects to actual CDN URL
  return'<img src="https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=200"'+
    ' alt="'+name+'" loading="lazy"'+
    ' onerror="this.parentElement.innerHTML=\'<span style=font-size:40px>🐱</span>\'"'+
    ' style="width:100%;height:100%;object-fit:cover">';
}

// ── 状态 ──
var audioCtx=null,stream=null,recorder=null,analyser=null;
var chunks=[],recStart=0,recTimer=null,animId=null;
var lastResult=null,lastBlob=null,catPhotoData=null;
var db=null;

// ── 音频引擎 ──
async function ensureCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:SAMPLE_RATE});
  if(audioCtx.state==='suspended') await audioCtx.resume();
  return audioCtx;
}

async function startRec(){
  try{
    chunks=[];
    var ctx=await ensureCtx();
    stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:SAMPLE_RATE,channelCount:1,echoCancellation:true,noiseSuppression:false}});
    var src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser();
    analyser.fftSize=1024;
    analyser.smoothingTimeConstant=0.3;
    src.connect(analyser);
    recorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
    recorder.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data)};
    recorder.onstop=analyze;
    recorder.start(100);
    recStart=Date.now();
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micBtn').textContent='⏹️';
    document.getElementById('micHint').textContent='录音中…再点停止';
    document.getElementById('resultsArea').innerHTML='';
    document.getElementById('saveBtn').style.display='none';
    document.getElementById('audioRow').style.display='none';
    updateTimer();
    recTimer=setInterval(updateTimer,150);
    drawWave();
    return true;
  }catch(e){
    console.error(e);
    document.getElementById('micHint').textContent='⚠️ 请允许麦克风权限后重试';
    return false;
  }
}

function drawWave(){
  var cvs=document.getElementById('waveCanvas'),w=cvs.width,h=cvs.height,ctx=cvs.getContext('2d');
  function f(){
    if(!analyser)return;
    var d=new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(d);
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();ctx.strokeStyle='#f4a460';ctx.lineWidth=2;
    var step=Math.floor(d.length/w);
    for(var x=0;x<w;x++){
      var sum=0;for(var j=0;j<step;j++)sum+=d[Math.min(x*step+j,d.length-1)];
      var y=(sum/step/255)*h;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    animId=requestAnimationFrame(f);
  }
  f();
}

function clearWave(){
  var cvs=document.getElementById('waveCanvas'),ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,cvs.width,cvs.height);
}

  try{

    };

    var buf=await blob.arrayBuffer();
    var ctx=await ensureCtx();
    var audioBuf=await ctx.decodeAudioData(buf);
    var dur=audioBuf.duration;
    var features=extract(audioBuf);

    // ── 人类声音检测 ──
    var humanCheck=detectHumanVoice(audioBuf,features,dur);

    // 总是做猫情绪分类（不管人声还是猫叫都输出）

  }
}

function extract(buf){
  var s=buf.getChannelData(0),n=s.length,sr=buf.sampleRate;

  // RMS
  var sum=0;for(var i=0;i<n;i++)sum+=s[i]*s[i];
  var rms=Math.sqrt(sum/n);

  // Zero-crossing rate
  var z=0;for(var i=1;i<n;i++)if((s[i]>=0&&s[i-1]<0)||(s[i]<0&&s[i-1]>=0))z++;
  var zcr=z/n;

  // Find peak frequency using autocorrelation (MUCH faster than DFT)
  var peakFreq=findPeakFreq(s,sr);

  // Spectral centroid estimation from autocorrelation
  var centroid=estimateCentroid(s,sr,peakFreq);

  // Low frequency ratio
  var loE=0,totE=0;
  for(var i=0;i<n;i++){totE+=s[i]*s[i];}
  var loCount=0;for(var i=1;i<n;i++)if(Math.abs(s[i]-s[i-1])<0.01)loCount++;
  var loRatio=loCount/n;

  // Intonation contour: first-half vs second-half F0
  var mid=Math.floor(n/2);
  var f0First=findPeakFreq(s.subarray(0,mid),sr);
  var f0Second=findPeakFreq(s.subarray(mid),sr);
  var contour=0;
  if(f0First>0&&f0Second>0) contour=(f0Second-f0First)/f0First; // + = rising, - = falling

  return{rms:rms,zcr:zcr,peakFreq:peakFreq,centroid:centroid,lowRatio:loRatio,contour:contour,sr:sr,n:n};
}

// Fast peak frequency via autocorrelation
function findPeakFreq(samples,sr){
  var n=samples.length,minLag=Math.floor(sr/4000),maxLag=Math.floor(sr/50);
  if(minLag<1)minLag=1;if(maxLag>n-1)maxLag=n-1;
  var bestLag=minLag,bestCorr=-1;
  for(var lag=minLag;lag<maxLag;lag++){
    var corr=0;for(var i=0;i<n-lag;i++)corr+=samples[i]*samples[i+lag];
    if(corr>bestCorr){bestCorr=corr;bestLag=lag;}
  }
  return sr/bestLag;
}

function estimateCentroid(samples,sr,peakFreq){
  // Simple centroid: weight based on autocorrelation spread
  // For harmonic sounds (cats), centroid is near peak * 1.3
  // For noise, centroid is higher
  var n=samples.length,z=0;for(var i=1;i<n;i++)if((samples[i]>=0&&samples[i-1]<0)||(samples[i]<0&&samples[i-1]>=0))z++;
  var zcr=z/n;
  if(zcr>0.4)return peakFreq*2.5;  // noisy
  if(zcr>0.2)return peakFreq*1.8;  // mixed
  return peakFreq*1.3;  // harmonic
}

// ── 人类声音检测（参照语音声学研究） ──
// 人声和猫叫的声学差异：
//   人声 F0: 80-550 Hz (男性 85-180, 女性 165-550)
//   猫叫 F0: 通常 300-1200 Hz (除咕噜声 20-80 Hz)
//   人声谐波: 规律倍频, 4+ 清晰峰值
//   猫叫谐波: 较不规则, 通常 2-3 个谐波
//   人声共振峰: F1/F2/F3 清晰 (声道共鸣)
//   人声频谱斜率: -10 dB/oct 或更陡
//   猫叫频谱斜率: -6 dB/oct 或更缓

function detectHumanVoice(audioBuf, features, dur){
  // Human F0: male 85-180Hz, female 165-550Hz
  // Cat meow F0: 300-1200Hz (Schötz 2024), purr: 18-31Hz
  var s=audioBuf.getChannelData(0), n=s.length, sr=audioBuf.sampleRate;
  var score=0, ind=[], det={};
  det.peakHz=Math.round(features.peakFreq);
  det.zcrPct=Math.round(features.zcr*100);
  var f0h=findHumanF0(s,sr);
  det.f0Human=Math.round(f0h);

  // 1. Human F0 range (weight 4): male 85-180Hz, female 165-550Hz
  if(f0h>=70 && f0h<=500 && features.peakFreq>=70 && features.peakFreq<=550){
    score+=4;
    if(f0h<250) ind.push('基频'+det.f0Human+'Hz 在男性人声范围(85-250Hz)');
    else if(f0h<400) ind.push('基频'+det.f0Human+'Hz 在女性人声范围(165-400Hz)');
    else ind.push('基频'+det.f0Human+'Hz 在人声高声区');
  } else if(f0h>=500 && f0h<=800){
    score+=2;
    ind.push('基频'+det.f0Human+'Hz 接近人声上限(模仿猫叫)');
  }

  // 2. Purr exclusion: F0<60Hz + low ZCR + long (weight -4)
  if(features.peakFreq<60 && features.lowRatio>0.4 && dur>1.5){
    score-=4; ind.push('排除: 超低频长持续=猫咕噜声(F0='+det.peakHz+'Hz)');
  }

  // 3. Hiss exclusion: high ZCR + high peak (weight -4)
  if(features.zcr>0.30 && features.peakFreq>1500){
    score-=4; ind.push('排除: 嘶嘶声特征(ZCR='+det.zcrPct+'%)');
  }

  // 4. ZCR for human speech modulation
  if(features.zcr>0.04 && features.zcr<0.18 && f0h>80 && f0h<450){
    score+=1; ind.push('ZCR在人声调制范围内('+det.zcrPct+'%)');
  }

  // 5. Harmonic structure
  if(features.zcr<0.18 && f0h>70){
    score+=1; ind.push('谐波结构规则，人声特征');
  }

  // 6. Short duration
  if(dur<2.5 && f0h>70 && f0h<500) score+=0.5;

  var isHuman=(score>=4 && features.peakFreq>60 && features.peakFreq<600);
  return{isHuman:isHuman,confidence:Math.min(95,Math.max(5,Math.round((score+3)/10*100))),
    score:score,indicators:ind.slice(0,4),details:det};
}

function findHumanF0(samples,sr){
  var n=samples.length;
  var minLag=Math.max(2,Math.floor(sr/550));
  var maxLag=Math.min(n-1,Math.floor(sr/70));
  if(maxLag<=minLag) return 0;
  var step=Math.max(1,Math.floor(n/3000));
  var ds=[]; for(var i=0;i<n;i+=step) ds.push(samples[i]);
  var dsN=ds.length, dsMin=Math.max(1,Math.floor(minLag/step)), dsMax=Math.min(dsN-1,Math.floor(maxLag/step));
  var bestL=dsMin, bestC=-Infinity;
  for(var lag=dsMin;lag<=dsMax;lag++){
    var c=0; for(var i=0;i<dsN-lag;i++) c+=ds[i]*ds[i+lag];
    var norm=0; for(i=0;i<dsN;i++) norm+=ds[i]*ds[i];
    if(norm>0) c=c/(norm/dsN);
    if(c>bestC){bestC=c;bestL=lag;}
  }
  if(bestC<0.02) return 0;
  return Math.round(sr/(bestL*step));
}

// Fast human fundamental frequency detection (80-600 Hz range)
function findF0Human(samples,sr){
  var n=samples.length;
  // Lag range for 70-600 Hz
  var minLag=Math.max(2,Math.floor(sr/600));
  var maxLag=Math.min(n-1,Math.floor(sr/70));
  if(maxLag<=minLag)return 0;

  // Downsample for speed
  var step=Math.max(1,Math.floor(n/4000));
  var ds=[],i;
  for(i=0;i<n;i+=step)ds.push(samples[i]);
  var dsN=ds.length,dsMin=Math.max(1,Math.floor(minLag/step)),dsMax=Math.min(dsN-1,Math.floor(maxLag/step));

  var bestLag=dsMin,bestCorr=-Infinity;
  for(var lag=dsMin;lag<=dsMax;lag++){
    var corr=0,cnt=0;
    for(i=0;i<dsN-lag;i++){corr+=ds[i]*ds[i+lag];cnt++;}
    corr=(cnt>0)?corr/cnt:0;
    // Normalize
    var norm=0;for(i=0;i<dsN;i++)norm+=ds[i]*ds[i];
    if(norm>0)corr=corr/(norm/cnt);
    if(corr>bestCorr){bestCorr=corr;bestLag=lag;}
  }

  if(bestCorr<0.03)return 0;
  return Math.round(sr/(bestLag*step));
}

// ── 情绪分类 ──
function classify(f,dur){
  // EXPONENTIAL scoring — amplifies differences between emotions
  // Key insight: pow(0.5, dist) decays faster than linear, discrimination is better
  var results = EMOTIONS.map(function(e){
    var sc=0,w=0;

    // 1. F0 match (weight 4.0)
    var fmid=(e.f0Lo+e.f0Hi)/2, fh=(e.f0Hi-e.f0Lo)/2;
    var fdist=Math.abs(f.peakFreq-fmid)/Math.max(fh,1);
    sc+=4.0*Math.pow(0.45,fdist); w+=4.0;

    // 2. Duration (weight 3.5 — strong differentiator per Schötz 2024)
    var dmid=(e.dLo+e.dHi)/2, dh=(e.dHi-e.dLo)/2+0.01;
    var ddist=Math.abs(dur-dmid)/dh;
    sc+=3.5*Math.pow(0.35,ddist); w+=3.5;

    // 3. ZCR (weight 4.0 — strongest harmonic vs noise discriminator)
    var zmid=(e.zLo+e.zHi)/2, zh=(e.zHi-e.zLo)/2+0.001;
    var zdist=Math.abs(f.zcr-zmid)/zh;
    sc+=4.0*Math.pow(0.30,zdist); w+=4.0;

    // 4. Centroid (weight 1.5)
    var cmid=(e.cLo+e.cHi)/2, ch=(e.cHi-e.cLo)/2;
    var cdist=Math.abs(f.centroid-cmid)/Math.max(ch,1);
    sc+=1.5*Math.pow(0.5,cdist); w+=1.5;

    // 5. Energy (weight 1.5)
    var ev={'very-low':[0,0.03],'low':[0.01,0.06],'medium':[0.03,0.15],
            'medium-high':[0.08,0.3],'high':[0.15,0.6]}[e.e]||[0.02,0.2];
    var emid=(ev[0]+ev[1])/2, eh=(ev[1]-ev[0])/2+0.01;
    var edist=Math.abs(f.rms-emid)/eh;
    sc+=1.5*Math.pow(0.5,edist); w+=1.5;

    // 6. Harmonic consistency (weight 4.0 — strong discriminator)
    if(e.harm){
      if(f.zcr<0.16) sc+=4.0;
      else if(f.zcr<0.26) sc+=2.0;
      else if(f.zcr<0.35) sc+=0.5;
      else sc-=2.5;
    } else {
      if(f.zcr>0.38) sc+=4.0;
      else if(f.zcr>0.28) sc+=2.0;
      else sc-=3.5;
    }
    w+=4.0;

    // 7. Intonation contour (weight 5.0 — Schötz 2024 KEY FINDING)
    if(e.contour==='rising' && f.contour>0.07) sc+=5.0;
    else if(e.contour==='rising' && f.contour>0.03) sc+=2.5;
    else if(e.contour==='falling' && f.contour<-0.07) sc+=5.0;
    else if(e.contour==='falling' && f.contour<-0.03) sc+=2.5;
    else if(e.contour==='flat' && Math.abs(f.contour)<=0.03) sc+=5.0;
    else if(Math.abs(f.contour)<=0.06) sc+=2.0;
    else sc-=2.0;
    w+=5.0;

    // 8. Purr-specific (weight 3.5)
    if(e.purr){
      sc+=3.5*f.lowRatio;
      w+=3.5;
    }

    // 9. Repetition (weight 2.0)
    if(e.rep && dur<0.7) sc+=2.0;
    w+=2.0;

    var rawScore=w>0?Math.max(0,sc/w):0;
    return{eid:e.id,emoji:e.emoji,name:e.name,desc:e.desc,color:e.color,rawScore:rawScore};
  });

  results.sort(function(a,b){return b.rawScore-a.rawScore;});

  // SOFMAX to amplify score differences
  var top3=results.slice(0,3);
  var totalExp=0;
  top3.forEach(function(r){totalExp+=Math.exp(r.rawScore*4)});
  if(totalExp<0.001) totalExp=3;

  // Add diagnostics to the result
  var classified=top3.map(function(r){
    return{eid:r.eid,emoji:r.emoji,name:r.name,desc:r.desc,color:r.color,
      probability:Math.min(93,Math.max(2,Math.round(Math.exp(r.rawScore*4)/totalExp*100)))};
  });

  // Store diagnostic info on lastResult for display
  classified._diag={peakHz:Math.round(f.peakFreq),durMs:Math.round(dur*1000),
    zcrPct:Math.round(f.zcr*100),contourSign:Math.round(f.contour*100)};
  return classified;
}

            var db=CAT_BREEDS.find(function(b){return r.name.indexOf(b.name)>=0||(b.name&&r.name.indexOf(b.name.substring(0,2))>=0)});
            return '<div class="result-item">'+
              '<div style="min-width:56px;height:56px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#2d2d4a">'+
              breedImg(db?db.name:'猫')+'</div>'+
              '<div class="result-info"><div class="result-name">'+(db?db.name:r.name)+'</div>'+
              '<div class="result-desc">'+(db?'性格:'+db.traits+' | 叫声:'+db.vocal:'图鉴暂无')+'</div>'+
              '<div class="result-bar-bg"><div class="result-bar-fg" style="width:'+r.probability+'%;background:#f4a460"></div></div></div>'+
              '<div class="result-pct" style="color:#f4a460">'+r.probability+'%</div></div>';
          }).join('');
      });
    });
  });
}

// ── IndexedDB ──
function openDB(cb){
  var req=indexedDB.open('CatDB',1);
  req.onupgradeneeded=function(e){if(!e.target.result.objectStoreNames.contains('cats'))e.target.result.createObjectStore('cats',{keyPath:'id',autoIncrement:true})};
  req.onsuccess=function(e){db=e.target.result;cb()};
  req.onerror=function(e){console.error('DB error:',e);cb()};
}

function getCats(cb){
  if(!db){cb([]);return;}
  var tx=db.transaction('cats','readonly'),store=tx.objectStore('cats'),req=store.getAll();
  req.onsuccess=function(){cb(req.result||[])};req.onerror=function(){cb([])};
}

function addCat(cat,cb){
  if(!db){cb(null);return;}
  var tx=db.transaction('cats','readwrite'),store=tx.objectStore('cats'),req=store.add(cat);
  req.onsuccess=function(){cb(req.result)};req.onerror=function(){cb(null)};
}

function updateCat(id,data,cb){
  if(!db){cb(false);return;}
  var tx=db.transaction('cats','readwrite'),store=tx.objectStore('cats');
  var gr=store.get(id);
  gr.onsuccess=function(){
    var cat=gr.result;if(!cat){cb(false);return;}
    Object.assign(cat,data);store.put(cat).onsuccess=function(){cb(true)};
  };
  gr.onerror=function(){cb(false)};
}

function deleteCat(id,cb){
  if(!db){cb(false);return;}
  var tx=db.transaction('cats','readwrite'),store=tx.objectStore('cats');
  store.delete(id).onsuccess=function(){cb(true)};
}

// ── 图鉴 ──
function renderBreedGrid(){
  var grid=document.getElementById('breedGrid');
  grid.innerHTML=CAT_BREEDS.map(function(b){
    return '<div class="breed-chip" onclick="showBreed(\''+b.name+'\')">'+
      breedImg(b.name)+'<div class="label">'+b.name+'</div></div>';
  }).join('');
}

function showBreed(name){
  var b=CAT_BREEDS.find(function(x){return x.name===name});if(!b)return;
  document.getElementById('detailContent').innerHTML=
    '<div style="text-align:center"><div style="width:100%;height:180px;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#2d2d4a;display:flex;align-items:center;justify-content:center">'+
    breedImg(name)+'</div><h3>'+b.name+'</h3>'+
    '<div style="font-size:13px;color:#a0a0c0;margin:6px 0">性格：'+b.traits+'</div>'+
    '<div style="font-size:13px;color:#a0a0c0;margin:6px 0">叫声：'+b.vocal+'</div></div>';

}

// ── 猫咪列表 ──
function renderCatList(){
  getCats(function(cats){
    var list=document.getElementById('catList');
    if(cats.length===0){list.innerHTML='<div class="empty"><div class="icon">🐱</div><div>还没有添加猫咪</div></div>';return;}
    list.innerHTML=cats.map(function(c){
      var recs=c.recordings||[];
      return '<div class="cat-card" onclick="viewCat('+c.id+')">'+
        '<div class="cat-avatar">'+(c.photo?'<img src="'+c.photo+'">':'🐱')+'</div>'+
        '<div class="cat-info"><div class="cat-name">'+(c.name||'未命名')+'</div>'+
        '<div class="cat-meta">'+(c.breed||'未知')+' · '+recs.length+'条记录</div></div>'+
        '<button class="btn-small" style="background:#ff4757;color:#fff;font-size:10px;padding:6px 10px" onclick="event.stopPropagation();delCat('+c.id+')">🗑</button></div>';
    }).join('');
  });
}

function viewCat(id){
  getCats(function(cats){
    var c=cats.find(function(x){return x.id===id});if(!c)return;
    var recs=c.recordings||[];
    document.getElementById('detailContent').innerHTML=
      '<div style="text-align:center"><div style="width:100px;height:100px;border-radius:50%;overflow:hidden;margin:0 auto 12px;background:#2d2d4a;display:flex;align-items:center;justify-content:center">'+
      (c.photo?'<img src="'+c.photo+'" style="width:100%;height:100%;object-fit:cover">':'<span style="font-size:48px">🐱</span>')+'</div>'+
      '<h3>'+(c.name||'未命名')+'</h3>'+
      '<div style="font-size:12px;color:#a0a0c0">品种：'+(c.breed||'未知')+'</div>'+
      '<div style="font-size:12px;color:#a0a0c0;margin-top:4px">声音记录：'+recs.length+'条</div>'+
      (recs.length>0?'<div style="margin-top:8px;text-align:left;font-size:11px;color:#a0a0c0">'+
        recs.slice(-3).reverse().map(function(r){return '<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)">'+
          new Date(r.t).toLocaleString('zh-CN')+': '+ (r.e||[]).slice(0,2).map(function(e){return e.n+e.p+'%'}).join(', ')+'</div>'}).join('')+'</div>':'')+'</div>';
    document.getElementById('detailModal').style.display='flex';
  });
}

function delCat(id){
  if(!confirm('确定删除？'))return;
  deleteCat(id,function(){renderCatList()});
}

function saveToCat(){
  if(!lastResult){toast('请先录音');return;}
  getCats(function(cats){
    if(cats.length===0){toast('请先在「我的猫咪」中添加一只猫');return;}
    var html='<h3>💾 保存到…</h3>';
    cats.forEach(function(c){html+='<div class="cat-card" onclick="doSave('+c.id+')" style="cursor:pointer"><div class="cat-avatar">'+(c.photo?'<img src="'+c.photo+'">':'🐱')+'</div><div class="cat-info"><div class="cat-name">'+c.name+'</div></div></div>'});
    document.getElementById('detailContent').innerHTML=html;
    document.getElementById('detailModal').style.display='flex';
  });
}

function doSave(catId){
  var rec={t:lastResult.timestamp,d:Math.round(lastResult.duration*1000),
    e:lastResult.results.slice(0,3).map(function(r){return{n:r.name,p:r.probability}})};
  getCats(function(cats){
    var c=cats.find(function(x){return x.id===catId});if(!c)return;
    var recs=c.recordings||[];recs.push(rec);
    if(recs.length>50)recs.shift();
    updateCat(catId,{recordings:recs},function(){
      document.getElementById('detailModal').style.display='none';toast('✅ 已保存！');
    });
  });
}

// ── 工具 ──
function toast(msg){
  var t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove()},2200);
}

// ── Camera functions ─────────────────────────────
var _camStream = null;
var _camFacing = 'environment';  // default: back camera

function openCamera(){
  var vid = document.getElementById('camVideo');
  var modal = document.getElementById('cameraModal');
  var loading = document.getElementById('camLoading');
  var errDiv = document.getElementById('camError');
  var flipBtn = document.getElementById('camFlipBtn');

  // Reset state
  errDiv.style.display = 'none';
  vid.style.display = 'none';
  loading.style.display = 'block';
  flipBtn.style.display = 'none';
  modal.style.display = 'flex';

  // Close any existing stream
  if (_camStream) {
    _camStream.getTracks().forEach(function(t){t.stop();});
    _camStream = null;
  }
  vid.srcObject = null;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errDiv.style.display = 'block';
    errDiv.textContent = '此浏览器不支持摄像头，请使用相册上传';
    loading.style.display = 'none';
    return;
  }

  startCameraStream(vid, loading, errDiv, flipBtn);
}

function startCameraStream(vid, loading, errDiv, flipBtn){
  var constraints = {video:{width:640,height:480,facingMode:_camFacing}};

  navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    _camStream = stream;
    vid.srcObject = stream;
    vid.onloadedmetadata = function(){
      vid.play();
      vid.style.display = 'block';
      loading.style.display = 'none';
      // Show flip button if device has multiple cameras
      if (navigator.mediaDevices.enumerateDevices) {
        flipBtn.style.display = 'inline-flex';
      }
    };
  }).catch(function(e){
    // Try without specific facingMode
    if (_camFacing !== 'user') {
      _camFacing = 'user';
      navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){
        _camStream = stream;
        vid.srcObject = stream;
        vid.onloadedmetadata = function(){
          vid.play();
          vid.style.display = 'block';
          loading.style.display = 'none';
          flipBtn.style.display = 'inline-flex';
        };
      }).catch(function(e2){
        loading.style.display = 'none';
        errDiv.style.display = 'block';
        errDiv.textContent = '无法打开摄像头，请确认已授权相机权限';
        flipBtn.style.display = 'none';
        // Fallback to gallery on mobile
        document.getElementById('galleryInput').click();
        closeCamera();
      });
    } else {
      loading.style.display = 'none';
      errDiv.style.display = 'block';
      errDiv.textContent = '无法打开摄像头，请使用相册上传';
      flipBtn.style.display = 'none';
    }
  });
}

function flipCamera(){
  _camFacing = (_camFacing === 'environment') ? 'user' : 'environment';
  var vid = document.getElementById('camVideo');
  var loading = document.getElementById('camLoading');
  var errDiv = document.getElementById('camError');
  var flipBtn = document.getElementById('camFlipBtn');

  // Stop current stream
  if (_camStream) {
    _camStream.getTracks().forEach(function(t){t.stop();});
    _camStream = null;
  }
  vid.srcObject = null;
  vid.style.display = 'none';
  loading.style.display = 'block';

  startCameraStream(vid, loading, errDiv, flipBtn);
}

function closeCamera(){
  if (_camStream) {
    _camStream.getTracks().forEach(function(t){t.stop();});
    _camStream = null;
  }
  var vid = document.getElementById('camVideo');
  vid.srcObject = null;
  vid.style.display = 'none';
  document.getElementById('cameraModal').style.display = 'none';
}

function snapPhoto(){
  var vid = document.getElementById('camVideo');
  var canvas = document.getElementById('camCanvas');
  if (!vid.videoWidth) {
    document.getElementById('camError').style.display = 'block';
    document.getElementById('camError').textContent = '相机未就绪，请稍等再拍';
    return;
  }
  canvas.width = vid.videoWidth;
  canvas.height = vid.videoHeight;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
  var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  document.getElementById('photoPreview').innerHTML = '<img src="' + dataUrl + '">';
  document.getElementById('analyzeBtn').disabled = false;
  closeCamera();
}

  if(!name){toast('请输入名字');return;}
  addCat({name:name,photo:catPhotoData,breed:'',recordings:[],createdAt:Date.now()},function(){
    document.getElementById('addCatModal').style.display='none';toast('✅ 已添加！');renderCatList();
  });
};
document.getElementById('catPhotoInput').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),mx=300,w=img.width,h=img.height;
      if(w>h){h=Math.round(h*mx/w);w=mx}else{w=Math.round(w*mx/h);h=mx}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      catPhotoData=c.toDataURL('image/jpeg',0.7);
      document.getElementById('catPhotoPreview').innerHTML='<img src="'+catPhotoData+'">';
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
};

// Close modals
document.getElementById('addCatModal').onclick=function(e){if(e.target===this)this.style.display='none'};
document.getElementById('detailModal').onclick=function(e){if(e.target===this)this.style.display='none'};

openDB(function(){console.log('DB ready')});
renderBreedGrid();
