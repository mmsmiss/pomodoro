plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cc.cat'
    compileSdk 34

    defaultConfig {
        applicationId "org.cc.cat"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
